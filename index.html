<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diário do Escalador Frango</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Escalador Frango">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<!-- fontes no próprio app (e no cache do service worker): abrem certas mesmo sem sinal no ginásio -->
<link rel="preload" href="fontes/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fontes/bebas-neue.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Archivo é variável: um arquivo só cobre os pesos 400 a 700 */
@font-face{font-family:"Archivo";font-style:normal;font-weight:400 700;font-display:swap;src:url(fontes/archivo.woff2) format("woff2")}
@font-face{font-family:"Bebas Neue";font-style:normal;font-weight:400;font-display:swap;src:url(fontes/bebas-neue.woff2) format("woff2")}
:root{
  color-scheme:dark;
  --bg:#000; --s1:#141412; --s2:#1f1e1b; --line:#2c2b28;
  --ink:#f3f0e9; --ink2:#aaa69c; --ink3:#8a867d;
  --gema:#FFC83D; --gema-ink:#1c1500;
  --d1:#d8cf9e; --d2:#E3A13B; --d3:#F0624A;
  --disp:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0;letter-spacing:.02em;line-height:.95}
p{margin:0}

.app{max-width:560px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}

/* topo */
.topo{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 0 18px}
.topo h1{font-size:36px}
.topo>div:first-child{min-width:0}
/* título do Treino congelado no alto ao rolar */
.topo.fixo{position:sticky;top:0;z-index:15;background:var(--bg);margin:calc(-14px - env(safe-area-inset-top,0px)) -16px 14px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid transparent;transition:border-color .2s}
.topo.fixo.rolou{border-bottom-color:var(--line)}
.app.retro .dia .hoje{background:#7EC8E3;color:#062634;font-weight:700}
.dia{display:flex;align-items:center;gap:4px;color:var(--ink2);font-size:14px;margin-top:4px}
.dia button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);font-size:20px}
.dia button:disabled{opacity:.25;cursor:default}
.dia{flex-wrap:wrap}
.dia .data{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dia .hoje{width:auto;height:auto;padding:4px 10px;border-radius:999px;font-size:13px;color:var(--ink);background:var(--s1)}
.pills{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--s1);font-weight:600;font-variant-numeric:tabular-nums}
.pill svg{width:16px;height:20px}
.pill.chama svg{transform-origin:50% 100%}
.pill.chama.pulsa svg{animation:chama 1.1s ease-out 2}
@keyframes chama{0%{transform:scale(1)}35%{transform:scale(1.7) rotate(-6deg)}70%{transform:scale(.9)}100%{transform:scale(1)}}

.aviso{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--s1);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px;color:var(--ink2)}
.aviso button{flex:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600;padding:6px 0}
.dica{font-size:13px;color:var(--ink3);margin:-6px 0 12px}

/* exercícios */
.ex{padding:14px 0 16px;border-top:1px solid var(--line)}
.ex-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.av{width:46px;height:46px;flex:none}
.av svg{width:100%;height:100%;display:block}
.ex-top h2{font-size:28px}
.tit{display:flex;align-items:center;gap:2px}
.info-bt{width:32px;height:32px;margin:-6px 0;display:grid;place-items:center;border-radius:50%;color:var(--ink3)}
.info-bt svg{width:18px;height:18px}
.info-lista{list-style:none;margin:4px 0 0;padding:0}
.info-lista li{padding:10px 0;border-top:1px solid var(--line);font-size:14px;color:var(--ink2)}
.info-lista b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.proto{font-size:13px;color:var(--ink3)}
.ex-top .rel{margin-left:auto;text-align:right;font-family:var(--disp);font-size:28px;line-height:1;color:var(--ink2)}
.ex-top .rel small{display:block;font:500 11px "Archivo",sans-serif;color:var(--ink3);letter-spacing:.01em}
.linha{display:grid;grid-template-columns:minmax(156px,1fr) minmax(0,1fr);align-items:center;gap:10px}
.linha+.linha{margin-top:10px}
.lado{width:28px;flex:none;font-size:13px;font-weight:600;color:var(--ink2)}
.stp{display:flex;align-items:center;justify-content:space-between;background:var(--s1);border-radius:12px;height:48px;flex:none}
.linha .stp{width:100%}
.stp button{width:40px;height:48px;font-size:22px;color:var(--ink2)}
.stp input{width:54px;height:48px;border:0;background:none;text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.stp span{font-size:12px;color:var(--ink3);margin:0 2px 0 -6px}
.sets{display:flex;gap:8px;margin-left:auto}
.linha .sets{margin-left:0;min-width:0}
.set{width:52px;height:48px;border-radius:12px;background:var(--s1);display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--ink3);font-variant-numeric:tabular-nums;position:relative;transition:background .15s}
.set.largo{width:172px;font-size:15px}
.linha .set.largo,.linha .set.feito{width:100%}
.sets:has(.feito){flex:1;min-width:0}
.set.feito{width:100%;display:flex;align-items:center;justify-content:flex-start;gap:10px;padding:0 14px;font-size:15px;color:var(--ink);text-align:left;box-shadow:inset 0 0 0 1.5px var(--line)}
.set.feito .ic{flex:none;width:24px;height:24px;display:block}
.set.feito .tx{display:grid;line-height:1.15;min-width:0}
.set.feito .tx small{font-size:12px;font-weight:500;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set.feito.ok{box-shadow:none}
.set.feito.ok .tx small{color:var(--gema-ink);opacity:.75}
.set.feito .tx{white-space:nowrap}
.mao-tit{font:700 12px "Archivo",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:14px 0 6px}
.ex-top+.mao-tit{margin-top:0}
.set.feito.falhou{background:rgba(240,98,74,.14);color:var(--d3);box-shadow:inset 0 0 0 2px var(--d3)}
.set.feito.falhou .tx small{color:var(--d3);opacity:.8}
.set.feito.treme-f{animation:nega .38s ease-in-out}
.set.feito.parcial{box-shadow:inset 0 0 0 1.5px var(--gema)}
/* dia passado: cor de destaque azul e faixa listrada para não confundir com o registro do dia */
.app.retro{--gema:#7EC8E3;--gema-ink:#062634}
.retro-faixa{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-6px 0 16px;padding:12px 14px;border-radius:12px;border:1px dashed #7EC8E3;background:repeating-linear-gradient(135deg,rgba(126,200,227,.16) 0 10px,rgba(126,200,227,.05) 10px 20px);font-size:14px;color:#cfeaf4}
.retro-faixa b{display:block;color:#7EC8E3;font-weight:700;margin-bottom:1px}
.retro-faixa button{flex:none;height:36px;padding:0 12px;border-radius:999px;background:#7EC8E3;color:#062634;font-weight:700;font-size:13px}
.app.retro .topo h1{color:#7EC8E3}
.app.retro .ex.completa::after{background-image:linear-gradient(100deg,transparent 30%,rgba(126,200,227,.4) 50%,transparent 70%)}
.proto.alerta{color:var(--d2)}
.set.ok{background:var(--gema);color:var(--gema-ink)}
.set.falha{background:transparent;box-shadow:inset 0 0 0 2px var(--d3);color:var(--d3)}
.set.falha::after{content:"";position:absolute;left:10px;right:10px;top:50%;height:2px;background:var(--d3);transform:rotate(-18deg)}
.set.pop{animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(.75)}100%{transform:scale(1)}}

.fechar{margin-top:18px;border-top:1px solid var(--line);padding-top:18px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:12px;background:var(--ink);color:#000;font-weight:700;font-size:16px}
.btn.sec{background:var(--s2);color:var(--ink)}
.btn.perigo{background:#E84855;color:#fff}
.aj .btn.perigo{margin-top:12px}
.folha .btn.apagar-bk{margin-top:10px}
.btn:disabled{opacity:.35;cursor:default}
.resumo-sess{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
.resumo-sess b{font-weight:600}
.resumo-sess button{color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600;padding:8px 0}

/* evolução */
.gal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 22px}
.gal button{display:grid;justify-items:center;align-content:start;gap:4px;text-align:center;min-width:0}
.gal svg{width:100%;max-width:74px;aspect-ratio:1;display:block}
.gal b{font-size:12px;font-weight:600;line-height:1.1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.gal span{font-size:11px;color:var(--ink3);line-height:1.1}
.card{padding:18px 0 20px;border-top:1px solid var(--line)}
.card-top{display:flex;gap:14px;align-items:center}
.card-top .msc-g{width:104px;height:104px;flex:none}
.card-top .msc-g svg{width:100%;height:100%;display:block}
.card h2{font-size:28px}
.fase{font-size:14px;color:var(--gema);font-weight:600}
.num{font-family:var(--disp);font-size:44px;line-height:.9;margin-top:6px;font-variant-numeric:tabular-nums}
.num small{font:500 13px "Archivo",sans-serif;color:var(--ink3);margin-left:4px}
.maos{font-size:13px;color:var(--ink2);margin-top:2px}
.info{font-size:14px;color:var(--ink2);margin-top:12px;display:grid;gap:4px}
.info b{color:var(--ink);font-weight:600}
.barra-f{height:6px;border-radius:3px;background:var(--s2);margin-top:10px;overflow:hidden}
.barra-f div{height:100%;background:var(--gema);border-radius:3px;transition:width .6s}
.enf{color:var(--d2)}
.rolagem-x{overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.rolagem-x::-webkit-scrollbar{display:none}
.rolagem-x svg.px{display:block;max-width:none;width:auto;height:auto}
.rolagem-y{max-height:360px;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--line)}
.rolagem-y.curta{max-height:220px;margin-top:12px}
.grafico{margin-top:14px}
.grafico svg{width:100%;height:auto;display:block;overflow:visible}
.gl{stroke:var(--line);stroke-width:1}
.corte{stroke:var(--ink3);stroke-width:1;stroke-dasharray:3 4}
.ax{fill:var(--ink3);font:11px "Archivo",sans-serif}
.vazio{font-size:14px;color:var(--ink3);padding:18px 0 4px}
/* Evolução antes do primeiro registro */
.evo-vazia{display:grid;justify-items:center;text-align:center;gap:10px;padding:8px 0 10px}
.evo-vazia .msc-g{width:150px;height:150px}
.evo-vazia .msc-g svg{width:100%;height:100%;display:block}
/* ovo esperando: balança, pula e a rachadura aparece; os risquinhos dos lados marcam o tremor */
.ovo-esp .ovo-casca,.ovo-esp .ovo-sombra{transform-box:fill-box;transform-origin:50% 100%}
.ovo-esp .ovo-sombra{transform-origin:50% 50%}
.ovo-esp .ovo-casca{animation:ovo-espera 3.4s ease-in-out .4s infinite}
.ovo-esp .ovo-sombra{animation:ovo-sombra 3.4s ease-in-out .4s infinite}
.ovo-esp .ovo-tremor{opacity:0;animation:ovo-tremor 3.4s ease-in-out .4s infinite}
.ovo-esp .ovo-racha{stroke-dasharray:100;stroke-dashoffset:100;animation:ovo-racha .9s ease-out 1.2s forwards}
@keyframes ovo-espera{0%,50%,100%{transform:none}55%{transform:rotate(-8deg)}61%{transform:rotate(8deg)}67%{transform:rotate(-6deg)}73%{transform:rotate(5deg)}79%{transform:rotate(0)}86%{transform:translateY(-14px)}93%{transform:translateY(0) scale(1.04,.96)}97%{transform:none}}
@keyframes ovo-sombra{0%,79%,100%{transform:none}86%{transform:scale(.75);opacity:.2}93%{transform:scale(1.08)}}
@keyframes ovo-tremor{0%,52%,82%,100%{opacity:0}58%,76%{opacity:.9}}
@keyframes ovo-racha{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.ovo-esp .ovo-racha{stroke-dashoffset:0}}
.evo-vazia h2{font-size:32px;margin-top:4px}
.evo-vazia p{font-size:14px;color:var(--ink2);max-width:32ch}
.evo-vazia .btn{margin-top:8px}
.lista{list-style:none;margin:0;padding:0}
.lista li{border-top:1px solid var(--line)}
.lista li{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:2px}
.lista .ses-info{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 0;font-size:14px;min-width:0}
.lista .ses-info em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ses-bt{height:40px;min-width:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink2)}
.ses-bt svg{width:19px;height:19px}
.ses-bt.armado{background:var(--d3);color:#000;font-weight:700;font-size:13px;padding:0 10px}
.lista time{color:var(--ink3);font-variant-numeric:tabular-nums}
.fal{color:var(--d3)}
.lista em{font-style:normal;color:var(--ink2)}
.lista .esf{font-weight:600;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:1px}
.sec-t{font-size:28px;margin:26px 0 4px}
.sec-linha{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 4px}
.sec-linha .sec-t{margin:0}
.add-bt{width:40px;height:40px;border-radius:50%;background:var(--s1);display:grid;place-items:center;font-size:24px;line-height:1;color:var(--ink)}
.data-in{display:block;width:100%;height:52px;border:0;border-radius:12px;background:var(--s2);color:var(--ink);font-size:17px;padding:0 14px;color-scheme:dark}
button.pill{cursor:pointer}
.seq-top{display:flex;align-items:center;gap:12px;margin:4px 0 6px}
.seq-top svg{width:44px;height:55px}
.seq-top b{font-family:var(--disp);font-size:64px;font-weight:400;line-height:.9}
.seq-dias{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.seq-dias div{display:grid;justify-items:center;gap:3px;font-size:11px;color:var(--ink3)}
.seq-dias i{width:100%;max-width:38px;aspect-ratio:1;border-radius:10px;background:var(--s2);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600;color:var(--ink3)}
.seq-dias i.f{background:var(--gema);color:var(--gema-ink)}
.seq-dias i.e{background:var(--ink2);color:#000}
.seq-dias i{position:relative}
.eng{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 10px;border-radius:999px;background:var(--s2);color:var(--gema);font-weight:700;font-size:14px;box-shadow:inset 0 0 0 1.5px var(--gema)}
.eng svg{width:22px;height:22px}
.mes-nav{display:flex;align-items:center;gap:10px;margin-top:8px}
.mes-bt{width:44px;height:44px;border-radius:50%;background:var(--s1);font-size:24px;line-height:1;color:var(--ink);display:grid;place-items:center}
.mes-bt:disabled{opacity:.25}
.mes-nav .mes-t{flex:1;text-align:center;font-weight:700;font-size:17px;color:var(--ink)}
.mes-chips{display:flex;gap:8px;margin-top:10px;padding-bottom:2px}
.mes-chip{flex:none;height:32px;padding:0 12px;border-radius:999px;background:var(--s1);color:var(--ink2);font-size:13px;font-weight:600;text-transform:capitalize}
.mes-chip.on{background:var(--gema);color:var(--gema-ink)}
.mes-t{min-width:120px;text-align:center}
.ag-sem,.ag-grade{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.ag-sem{margin:14px 0 6px}.ag-sem span{text-align:center;font-size:12px;color:var(--ink3);font-weight:600}
.ag-dia{position:relative;aspect-ratio:1;border-radius:12px;background:var(--s1);font-weight:700;font-size:15px;color:var(--ink3);font-variant-numeric:tabular-nums;overflow:hidden}
.ag-dia b{position:absolute;top:4px;left:6px;font-size:12px;font-weight:700;line-height:1}
.cab{fill:currentColor;stroke:currentColor;stroke-width:0;stroke-linejoin:round}
.cab .olho{fill:var(--s1)}
.ag-dia .cab{position:absolute;left:22%;top:24%;width:70%;height:70%;opacity:0;pointer-events:none}
.ag-dia.f,.ag-dia.e,.ag-dia.d{color:var(--ink2)}
.ag-dia.f .cab{color:var(--gema);opacity:.9}
.ag-dia.e .cab{color:var(--ink2);opacity:.75}
.ag-dia.d .cab,.ag-leg .d .cab{color:var(--ink3);fill:none;stroke-width:1.5;opacity:.9}
.ag-dia.d .cab .olho,.ag-leg .d .cab .olho{fill:currentColor;stroke:none}
.ag-leg span{display:inline-flex;align-items:center;gap:5px}
.ag-leg .cab{width:18px;height:18px;flex:none}
.ag-leg .f .cab{color:var(--gema)}.ag-leg .e .cab{color:var(--ink2)}
.conq-grade{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;margin-top:10px}
.conq{display:grid;justify-items:center;align-content:start;gap:13px;text-align:center;color:var(--ink)}
.conq-n{font-size:11px;line-height:1.2;font-weight:600;color:var(--ink2)}
.conq.off .conq-n{color:var(--ink3)}
.conq-bar{display:block;width:52px;height:4px;border-radius:2px;background:var(--s2);overflow:hidden}
.conq-bar i{display:block;height:100%;background:var(--gema);border-radius:2px}
.conq-bar.g{width:180px;height:6px;margin:0 auto 14px}
.med{position:relative;display:block;width:62px;height:62px;flex:none}
.med>svg{display:block;width:100%;height:100%;overflow:visible}
.med em{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-weight:800;font-size:10px;letter-spacing:.02em;padding:2px 7px;border-radius:999px;background:#E84855;color:#fff;box-shadow:0 0 0 2px var(--bg)}
.med.off em{background:var(--s2);color:var(--ink3)}
.med .cad{position:absolute;right:-2px;top:-2px;width:22px;height:22px;border-radius:50%;background:var(--s2);color:var(--ink3);display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.med .cad svg{width:12px;height:12px}
.med.g{width:120px;height:120px}
.med.g em{font-size:15px;padding:3px 12px;bottom:-10px}
.med.g .cad{width:34px;height:34px}.med.g .cad svg{width:18px;height:18px}
.conq-folha{text-align:center}
.conq-folha .med{margin:8px auto 22px}
.conq-st{font-weight:700;color:var(--ink2);margin:10px 0 8px}
.conq-st.ok{color:var(--gema)}
.niveis{list-style:none;margin:6px 0 18px;padding:0;display:grid;gap:8px;text-align:left}
.niveis li{display:grid;gap:3px;padding:10px 12px 10px 14px;border-radius:12px;background:var(--s2);border-left:4px solid #5a5a5a;color:var(--ink3)}
.niveis li.ok{color:var(--ink2)}
.niveis li.nv0.ok{border-left-color:#c97b3f}.niveis li.nv1.ok{border-left-color:#bfc6cf}.niveis li.nv2.ok{border-left-color:#FFC83D}
.niveis b{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.niveis li:not(.ok) b{color:var(--ink3)}
.niveis span{font-size:13px;line-height:1.35}
.niveis em{font-style:normal;font-weight:700;font-size:12px;color:var(--ink2)}
.niveis li.ok em{color:var(--gema)}
.niveis .conq-bar{width:100%;margin-top:3px}
/* celebração de conquista: o cadeado cai, a medalha gira como moeda e revela a cena */
.moeda-w{position:relative;perspective:800px;margin:6px 0 16px}
.moeda{position:relative;width:180px;height:180px;transform-style:preserve-3d;transition:transform .95s cubic-bezier(.25,1.35,.45,1)}
.moeda .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.moeda .verso{transform:rotateY(180deg)}
.moeda .med.g{width:180px;height:180px}
.moeda.virada{transform:rotateY(180deg)}
/* várias conquistas juntas: moedas menores lado a lado, com nome e nível embaixo */
.moeda-w.varias{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 6px;max-width:340px}
.moeda-i{position:relative;display:grid;justify-items:center;align-content:start;gap:14px;width:104px;text-align:center}
.varias .moeda{width:88px;height:88px}
.varias .moeda .med{width:88px;height:88px}
.varias .moeda .med em{font-size:11px}
.muitas .moeda-i{width:96px}.muitas .moeda,.muitas .moeda .med{width:72px;height:72px}
.moeda-i b{font-size:12px;line-height:1.2;font-weight:700;color:#fff}
.moeda-i span{margin-top:-10px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.moeda-i .nv0{color:#e09a5f}.moeda-i .nv1{color:#cfd5dc}.moeda-i .nv2{color:#FFC83D}
.cel-conq .moeda-i b,.cel-conq .moeda-i span{opacity:0;transition:opacity .35s}
.cel-conq.revela .moeda-i b,.cel-conq.revela .moeda-i span{opacity:1}
.cel-conq.entra .moeda-w{animation:surge .5s cubic-bezier(.3,1.6,.5,1)}
.cel-conq.revela .moeda-w{animation:bump .55s cubic-bezier(.3,1.8,.5,1)}
@keyframes surge{from{transform:scale(.35);opacity:0}}
@keyframes bump{40%{transform:scale(1.12)}}
.moeda-w .raios{position:absolute;left:50%;top:50%;width:380px;height:380px;margin:-190px 0 0 -190px;border-radius:50%;opacity:0;transition:opacity .6s;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,200,61,.2) 0 9deg,transparent 9deg 22.5deg);
  -webkit-mask-image:radial-gradient(circle,#000 22%,transparent 68%);mask-image:radial-gradient(circle,#000 22%,transparent 68%)}
.cel-conq.revela .raios{opacity:1;animation:gira 14s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.cel-conq .cad.treme{animation:cadtreme .5s ease-in-out}
@keyframes cadtreme{0%,100%{transform:rotate(0)}20%{transform:rotate(-20deg)}40%{transform:rotate(18deg)}60%{transform:rotate(-12deg)}80%{transform:rotate(8deg)}}
.cel-conq .cad.cai{animation:cadcai .45s ease-in forwards}
@keyframes cadcai{to{transform:translate(34px,170px) rotate(80deg);opacity:0}}
.cel-conq h2,.cel-conq p{opacity:0;transform:translateY(10px);transition:opacity .35s,transform .45s cubic-bezier(.3,1.6,.5,1)}
.cel-conq.revela h2,.cel-conq.revela p{opacity:1;transform:none}
.hist-tit{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ag-dia.x::after{content:"";position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--d3);box-shadow:0 0 0 1.5px var(--bg)}
.ag-dia.hoje{box-shadow:0 0 0 2px var(--ink)}
.ag-dia.fut{opacity:.3}
.dia-cenas{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin:6px 0 4px}
.dia-cena{display:grid;justify-items:center;align-content:start;gap:3px;text-align:center}
.dia-cena .msc-g{width:100%;max-width:120px}.dia-cena .msc-g svg{width:100%;height:auto;display:block}
.dia-cena b{font-family:var(--disp);font-weight:400;font-size:20px;color:var(--gema);line-height:1}
.dia-cena span{font-size:11px;color:var(--ink3);line-height:1.3}
.seq-dias i.x::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--d3);box-shadow:0 0 0 1.5px var(--s1)}
.seq-dias i.d{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink3)}
.seq-dias i.hoje{box-shadow:0 0 0 2px var(--ink)}
.sec-sub{font-size:13px;color:var(--ink3);margin-bottom:8px}
.estagios{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.estagios div{display:grid;justify-items:center;align-content:start;gap:2px;text-align:center}
.estagios svg{width:100%;max-width:120px;aspect-ratio:1;display:block;margin-bottom:4px}
.estagios b{font-size:13px;font-weight:600;line-height:1.15}
.estagios span{font-size:11px;color:var(--ink3)}

/* ajustes */
.aj{padding:16px 0;border-top:1px solid var(--line)}
.aj h2{font-size:28px;margin-bottom:6px}
.aj p{font-size:14px;color:var(--ink2)}
.cortes{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.cortes th{font-weight:500;color:var(--ink3);text-align:center;padding:4px 2px;font-size:12px}
.cortes th:first-child{text-align:left}
.cortes td{padding:4px 2px}
.cortes td:first-child{color:var(--ink2)}
.cortes input{width:100%;height:40px;border-radius:12px;border:0;background:var(--s1);text-align:center;font-size:16px;font-variant-numeric:tabular-nums}
.linha-bt{display:flex;gap:10px;margin-top:12px}

/* navegação */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav button{height:62px;display:grid;justify-items:center;align-content:center;gap:3px;font-size:12px;color:var(--ink3)}
nav button svg{width:22px;height:22px}
nav button[aria-current=page]{color:var(--gema)}
/* Treino no centro, em destaque: botão redondo amarelo saltando da barra */
nav button.centro{position:relative;color:var(--ink2)}
nav button.centro svg{box-sizing:content-box;width:26px;height:26px;padding:13px;margin-top:-26px;border-radius:50%;background:var(--s2);color:var(--ink);box-shadow:0 0 0 5px var(--bg),0 4px 14px rgba(0,0,0,.5);transition:background .2s,color .2s}
nav button.centro[aria-current=page]{color:var(--gema)}
nav button.centro[aria-current=page] svg{background:var(--gema);color:var(--gema-ink)}

/* folha inferior */
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.fundo.abre{animation:fade .2s}
.folha{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--s1);border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.abre .folha{animation:sobe .25s cubic-bezier(.2,.9,.3,1)}
@keyframes sobe{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.folha h2{font-size:28px;margin-bottom:4px}
.folha .sub{font-size:13px;color:var(--ink3);margin-bottom:12px}
.esforco{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.esforco button{height:48px;border-radius:12px;background:var(--s2);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.esforco button[aria-pressed=true]{background:var(--gema);color:var(--gema-ink)}
.bloco{margin-top:22px}
.bloco h3{font-size:22px;margin-bottom:10px}
.dual{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dual button{height:46px;border-radius:12px;background:var(--s2);font-weight:600}
.dual button[aria-pressed=true]{background:var(--gema);color:var(--gema-ink)}
.bloco h4{margin:16px 0 8px;font-size:13px;font-weight:600;color:var(--ink2)}
.tempos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tempos button{height:44px;border-radius:12px;background:var(--s2);font-weight:600;font-variant-numeric:tabular-nums}
.tempos button[aria-pressed=true]{background:var(--gema);color:var(--gema-ink)}
.intens{display:grid;gap:8px}
.intens button{display:grid;gap:2px;text-align:left;padding:10px 14px;border-radius:12px;background:var(--s2)}
.intens button b{font-size:16px}
.intens button span{font-size:13px;color:var(--ink3)}
.intens button[aria-pressed=true]{background:var(--gema);color:var(--gema-ink)}
.intens button[aria-pressed=true] span{color:var(--gema-ink);opacity:.8}
/* janela da sessão: a escolha dá um pulinho e solta faíscas, como o Feito */
.folha button[aria-pressed]{transition:background .15s,color .15s}
.folha button.sel-pop{animation:pop .42s cubic-bezier(.3,1.8,.5,1)}
#camada.retro{--gema:#7EC8E3;--gema-ink:#062634}
.abas-mao{margin-top:14px}
.abas-mao .qtd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;margin-left:6px;border-radius:10px;background:var(--d3);color:#000;font-size:12px;font-weight:700}
.mao-box{display:flex;justify-content:center;margin-top:10px}
.mao-svg{display:block;width:100%;max-width:360px;height:auto;aspect-ratio:288/330;touch-action:manipulation;-webkit-tap-highlight-color:transparent;--paper:#2b2a26;--line:#55524b;--ink:#f3f0e9}
.mao-svg [data-a]{cursor:pointer}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:12px;font-size:12px;color:var(--ink2)}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dor-txt{font-size:13px;color:var(--ink2);margin-top:10px;text-align:center;min-height:1.2em}
.folha .btn{margin-top:22px}
.peso-stp{display:flex;justify-content:center;margin:10px 0 0}
.peso-stp .stp input{width:90px;font-size:22px}
.erro{color:var(--d3);font-size:14px;margin-top:10px;text-align:center}

/* celebração */
.cel{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:24px;text-align:center;animation:fade .25s;overflow:hidden}
.cel-box{display:grid;justify-items:center;gap:10px;max-width:360px;position:relative;z-index:2}
.cel-box .msc-g{width:220px;height:220px}
.cel-box .msc-g svg{width:100%;height:100%;display:block}
.cel h2{font-size:58px;color:var(--gema)}
.cel p{font-size:16px;color:var(--ink);max-width:30ch}
.cel .btn{width:200px;margin-top:10px}
/* resumo do dia: as cenas da sessão em fila, uma embaixo da outra */
.ses-lista{display:grid;gap:10px;width:min(340px,calc(100vw - 48px));text-align:left;margin-bottom:6px}
.ses-i{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center;padding:8px 14px 8px 8px;border-radius:18px;background:#1b1a17;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);animation:ses-entra .45s cubic-bezier(.3,1.5,.5,1) both}
.cel-ses h2{order:-1;font-size:52px;margin-bottom:4px}
.ses-i:nth-child(2){animation-delay:.18s}.ses-i:nth-child(3){animation-delay:.36s}
@keyframes ses-entra{from{opacity:0;transform:translateY(16px) scale(.96)}}
.ses-i .msc-g{width:84px;height:84px}.ses-i .msc-g svg{width:100%;height:100%;display:block}
.ses-i b{display:block;font-family:var(--disp);font-weight:400;font-size:26px;line-height:1;color:var(--gema)}
.ses-i span{display:block;margin-top:4px;font-size:13px;line-height:1.3;color:var(--ink2)}
.cel .chamao{width:120px;height:150px;animation:chamao 1.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes chamao{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08) rotate(3deg)}}
.cel .contagem{font-family:var(--disp);font-size:96px;line-height:.8;color:var(--ink)}
.flutua{position:absolute;left:50%;top:18%;font-family:var(--disp);font-size:44px;color:var(--gema);animation:flutua 1.6s ease-out forwards;pointer-events:none}
@keyframes flutua{0%{transform:translate(-50%,40px);opacity:0}20%{opacity:1}100%{transform:translate(-50%,-50px);opacity:0}}
.confete{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;z-index:1;animation:cai linear forwards}
@keyframes cai{to{transform:translateY(110vh) rotate(720deg)}}
.festa{animation:pula .6s cubic-bezier(.3,1.6,.5,1) 3}
@keyframes pula{0%,100%{transform:translateY(0)}40%{transform:translateY(-26px)}}
.treme{animation:treme .5s ease-in-out 3}
@keyframes treme{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}

.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:#000;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* mascote */
.msc .st{display:none;transform-box:fill-box;transform-origin:50% 100%}
.msc .st.on{display:inline}
.msc .st.pop{animation:mpop .7s cubic-bezier(.3,1.7,.5,1)}
@keyframes mpop{0%{transform:scale(.2) rotate(-8deg)}100%{transform:scale(1) rotate(0)}}
.msc .burst{transform-box:fill-box;transform-origin:center;opacity:0}
.msc .burst.go{animation:burst .8s ease-out}
@keyframes burst{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(1.6)}}
.msc .blink{transform-box:fill-box;transform-origin:center;animation:blink 3.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.msc .shake{animation:shake .14s linear infinite}
.msc .shake2{animation:shake2 .07s linear infinite}
@keyframes shake{0%,100%{transform:translateX(-1.5px)}50%{transform:translateX(1.5px)}}
@keyframes shake2{0%,100%{transform:translateX(-2.5px)}50%{transform:translateX(2.5px)}}
/* franguinho: tremidinha curta de esforço, depois uma pausa para respirar */
.msc .treme{animation:treme 1.6s ease-in-out infinite}
@keyframes treme{0%,48%,100%{transform:translate(0,0) rotate(0)}8%{transform:translate(-.9px,0) rotate(-.6deg)}16%{transform:translate(.9px,0) rotate(.6deg)}24%{transform:translate(-.7px,0) rotate(-.4deg)}32%{transform:translate(.7px,0) rotate(.4deg)}40%{transform:translate(-.3px,0)}}
.msc .drip{animation:drip 1.4s ease-in infinite}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(40px);opacity:0}}
.msc .pena{transform-box:fill-box;transform-origin:center;animation:pena 3s ease-in infinite}
@keyframes pena{0%{transform:translate(0,0) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(-26px,70px) rotate(160deg);opacity:0}}
.msc .bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.msc .fl{transform-box:fill-box;transform-origin:100% 100%;animation:fl 1.1s ease-in-out infinite alternate}
.msc .fr{transform-box:fill-box;transform-origin:0% 100%;animation:fr 1.1s ease-in-out infinite alternate}
@keyframes fl{to{transform:rotate(10deg)}}
@keyframes fr{to{transform:rotate(-10deg)}}
.msc .xl{transform-box:fill-box;transform-origin:100% 100%;animation:xl .7s ease-in-out infinite alternate}
.msc .xr{transform-box:fill-box;transform-origin:0% 100%;animation:xr .7s ease-in-out infinite alternate}
@keyframes xl{to{transform:rotate(16deg)}}
@keyframes xr{to{transform:rotate(-16deg)}}
.msc .brilho{transform-box:fill-box;transform-origin:center;animation:brilho 1.6s ease-in-out infinite}
@keyframes brilho{0%,100%{transform:scale(.4);opacity:.2}50%{transform:scale(1);opacity:1}}
.msc .halter{transform-box:fill-box;transform-origin:0% 100%;animation:halter 1.1s ease-in-out infinite}
@keyframes halter{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-12deg)}}
.msc .olha{animation:olha 2.6s ease-in-out infinite}
@keyframes olha{0%,100%{transform:translateX(0)}30%{transform:translateX(-3px)}65%{transform:translateX(3px)}}
.msc .po{transform-box:fill-box;transform-origin:center;animation:po 1.8s ease-out infinite}
@keyframes po{0%{opacity:.75;transform:scale(.6)}100%{opacity:0;transform:scale(1.7)}}
.msc .duvida{animation:bob 1.2s ease-in-out infinite}
.msc .joinha{transform-box:fill-box;transform-origin:0% 100%;animation:joinha 1.4s ease-in-out infinite}
@keyframes joinha{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
.msc .reflexo{animation:reflexo 2.4s ease-in-out infinite}
@keyframes reflexo{0%,65%,100%{opacity:0}78%{opacity:1}}
.msc .fumaca{transform-box:fill-box;transform-origin:center;animation:fumaca 1.6s ease-out infinite}
@keyframes fumaca{0%{opacity:.9;transform:translateY(0) scale(.7)}100%{opacity:0;transform:translateY(-14px) scale(1.6)}}
.msc .voa{transform-box:fill-box;transform-origin:center;animation:voa 2.6s ease-in-out infinite}
@keyframes voa{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(2px,-5px) rotate(25deg)}}
.msc .fxl{transform-box:fill-box;transform-origin:100% 100%;animation:fxl .8s ease-in-out infinite alternate}
.msc .fxr{transform-box:fill-box;transform-origin:0% 100%;animation:fxr .8s ease-in-out infinite alternate}
@keyframes fxl{to{transform:rotate(9deg)}}
@keyframes fxr{to{transform:rotate(-9deg)}}
.msc.flex .fxl,.msc.flex .fxr,.msc.flex .joinha,.msc.flex .halter{animation-duration:.3s}
.msc .respira{transform-box:fill-box;transform-origin:50% 100%;animation:respira 2.6s ease-in-out infinite}
@keyframes respira{50%{transform:scale(1.04,1.07)}}
.msc .nota{transform-box:fill-box;transform-origin:center;animation:nota 2.4s ease-out infinite}
@keyframes nota{0%{opacity:0;transform:translateY(6px)}30%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.msc .alma{animation:alma 3s ease-in-out infinite}
@keyframes alma{0%,100%{transform:translateY(8px);opacity:.3}50%{transform:translateY(-8px);opacity:.8}}
.msc .vento{animation:vento .9s ease-in-out infinite}
@keyframes vento{0%,100%{opacity:.2;transform:translateX(-2px)}50%{opacity:1;transform:translateX(3px)}}
.msc .lateja{transform-box:fill-box;transform-origin:center;animation:lateja .7s ease-in-out infinite}
@keyframes lateja{50%{transform:scale(1.25);opacity:.5}}
.msc .lagrima{transform-box:fill-box;transform-origin:50% 0;animation:lagrima 1s ease-in-out infinite}
@keyframes lagrima{50%{transform:scaleY(1.25)}}
.msc .gelo{transform-box:fill-box;transform-origin:50% 100%;animation:gelo 1.4s ease-in-out infinite}
@keyframes gelo{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
/* cenas das medalhas de conquista */
.msc .m-chama{transform-box:fill-box;transform-origin:50% 100%;animation:mchama .9s ease-in-out infinite alternate}
@keyframes mchama{0%{transform:scale(1,1) skewX(0)}50%{transform:scale(1.06,.93) skewX(-4deg)}100%{transform:scale(.95,1.08) skewX(4deg)}}
.msc .m-pula{animation:mpula 1.1s cubic-bezier(.3,1.5,.5,1) infinite}
@keyframes mpula{0%,100%{transform:translateY(0)}40%{transform:translateY(-9px)}}
.msc .m-puxa{animation:mpuxa 1.5s ease-in-out infinite alternate}
@keyframes mpuxa{from{transform:translateY(3px)}to{transform:translateY(-3px)}}
.msc .m-ergue{animation:mergue 1.1s ease-in-out infinite}
@keyframes mergue{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.msc .m-gira{transform-box:fill-box;transform-origin:center;animation:gira 8s linear infinite}
.msc.enferrujado .ave{filter:sepia(.85) saturate(1.4) hue-rotate(-12deg) brightness(.72)}
.msc.enferrujado .ave *{animation-play-state:paused!important}
.msc.sem .ave{opacity:.35;filter:grayscale(1)}
.msc.sem .ave *{animation:none!important}
.msc.mini .ave *{animation:none!important}
.msc.flex .xl,.msc.flex .fl{animation-duration:.25s}
.msc.flex .xr,.msc.flex .fr{animation-duration:.25s}

/* tutorial: tela escurecida com um recorte iluminado no item e um balão apontando para ele */
.tour{position:fixed;inset:0;z-index:55}
.tour-bloq{position:absolute;inset:0}
.tour-luz{position:fixed;border-radius:14px;box-shadow:0 0 0 2px var(--gema),0 0 0 200vmax rgba(0,0,0,.74);pointer-events:none;transition:top .35s cubic-bezier(.3,.8,.3,1),left .35s cubic-bezier(.3,.8,.3,1),width .35s cubic-bezier(.3,.8,.3,1),height .35s cubic-bezier(.3,.8,.3,1),opacity .25s}
.tour-luz.nada{box-shadow:0 0 0 200vmax rgba(0,0,0,.8)}
.tour-balao{position:fixed;width:min(360px,calc(100vw - 32px));background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 16px 12px;box-shadow:0 10px 40px rgba(0,0,0,.6);transition:opacity .2s}
.tour-balao.some{opacity:0}
.tour-balao.entra{animation:tour-entra .35s cubic-bezier(.3,1.5,.5,1)}
.tour-balao.cutuca{animation:tour-cutuca .4s ease-in-out}
@keyframes tour-entra{from{opacity:0;transform:translateY(8px) scale(.96)}}
@keyframes tour-cutuca{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.tour-seta{position:absolute;width:14px;height:14px;background:var(--s1);border:1px solid var(--line);transform:rotate(45deg);margin-left:-7px}
.tour-seta.cima{top:-8px;border-right:0;border-bottom:0}
.tour-seta.baixo{bottom:-8px;border-left:0;border-top:0}
.tour-cab{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tour-av{width:48px;height:48px;flex:none}
.tour-av svg{width:100%;height:100%;display:block}
.tour-tag{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.tour-balao h2{font-size:26px;color:var(--gema)}
.tour-balao p{font-size:14px;color:var(--ink);line-height:1.45}
.tour-balao p+p{margin-top:8px}
.tour-pe{display:flex;align-items:center;gap:8px;margin-top:12px}
.tour-pular{font-size:13px;color:var(--ink3);padding:8px 0;white-space:nowrap;margin-right:auto}
.tour-volta{height:40px;padding:0 12px;border-radius:10px;background:var(--s2);font-weight:600;font-size:14px}
.tour-ok{height:40px;padding:0 16px;border-radius:10px;background:var(--gema);color:var(--gema-ink);font-weight:700;font-size:14px}
.tour-ok:active,.tour-volta:active{transform:scale(.96)}
.tour-balao.centro{text-align:center;padding:22px 20px 16px}
.tour-balao.centro .tour-cab{flex-direction:column;gap:6px;margin-bottom:10px}
.tour-balao.centro .tour-av{width:150px;height:150px}
.tour-balao.centro h2{font-size:36px}
.tour-balao.centro .tour-pe{flex-direction:column-reverse;gap:6px;margin-top:16px}
.tour-balao.centro .tour-pular{margin:0}
.tour-balao.centro .tour-ok{width:100%;height:48px;font-size:16px}
.aj .btn.tour-rever{margin-top:12px}
/* sobra embaixo durante o tutorial: até o último item pode subir para o alto da tela */
body.em-tour #app{padding-bottom:60vh}
body.em-tour .folha{padding-bottom:40vh}
/* passo com vários itens: a lista acompanha o recorte que passeia */
.tour-lista{list-style:none;display:grid;gap:4px;margin-top:2px}
.tour-lista button{display:grid;gap:1px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;font-size:14px;line-height:1.35;color:var(--ink2);border:1px solid transparent;transition:background .25s,border-color .25s,color .25s}
.tour-lista b{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);transition:color .25s}
.tour-lista button.on{background:var(--s2);border-color:var(--gema);color:var(--ink)}
.tour-lista button.on b{color:var(--gema)}
/* só o item em destaque mostra o texto: os outros ficam só com o nome */
.tour-lista button:not(.on) span{display:none}
.tour-lista button:not(.on){padding-block:5px}
/* último passo: só título e botão */
.tour-balao.so h2{font-size:44px;margin-bottom:4px}
/* dedo de exemplo que toca nos botões */
.tour-dedo{position:fixed;left:0;top:0;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:left .5s cubic-bezier(.4,0,.2,1),top .5s cubic-bezier(.4,0,.2,1),opacity .25s}
.tour-dedo.on{opacity:1}
.tour-dedo.sem-mov{transition:none}
.tour-dedo.toca{animation:tour-toca .32s ease-out}
@keyframes tour-toca{40%{transform:scale(.7);background:rgba(255,200,61,.7)}}
.tour-aperta{animation:tour-aperta .3s ease-out}
@keyframes tour-aperta{40%{transform:scale(.9)}}
/* boas-vindas: o ovo balança, racha e o Franguinho sai */
.tour-ovo .ovo,.tour-ovo .ovo-cima,.tour-ovo .ovo-baixo,.tour-ovo .pinto{transform-box:fill-box;transform-origin:50% 100%}
.tour-ovo .ovo{animation:ovo-mexe 2.6s ease-in-out .2s both}
.tour-ovo .ovo-risca{stroke-dasharray:100;animation:ovo-risca 2.6s linear .2s both}
.tour-ovo .ovo-cima{animation:ovo-cima 2.6s cubic-bezier(.3,.6,.4,1) .2s both}
.tour-ovo .ovo-baixo{animation:ovo-baixo 2.6s ease-in .2s both}
.tour-ovo .pinto{animation:ovo-pinto 2.6s cubic-bezier(.3,1.4,.5,1) .2s both}

@keyframes ovo-risca{0%,30%{stroke-dashoffset:100}46%,100%{stroke-dashoffset:0}}
@keyframes ovo-cima{0%,50%{transform:none;opacity:1}72%{opacity:1}86%,100%{transform:translate(46px,-96px) rotate(55deg);opacity:0}}
@keyframes ovo-baixo{0%,56%{transform:none;opacity:1}84%,100%{transform:translateY(34px) scale(.9);opacity:0}}
@keyframes ovo-pinto{0%,50%{transform:scale(.25);opacity:0}56%{opacity:1}70%{transform:scale(1.12)}82%{transform:scale(.95)}92%,100%{transform:scale(1);opacity:1}}

.tour-balao{max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);overflow:auto}
.tour-balao:not(.centro){overflow:visible}
.tour-pe{flex-wrap:wrap}
.tour-ok,.tour-volta{white-space:nowrap}
@media (max-width:400px){.tour-balao{padding:12px 14px 10px}.tour-balao h2{font-size:23px}.tour-av{width:40px;height:40px}}

/* abertura */
#abertura{position:fixed;inset:0;z-index:60;background:#000;display:grid;place-items:center;text-align:center;padding:24px;transition:opacity .45s,transform .45s}
#abertura.sai{opacity:0;transform:scale(1.06);pointer-events:none}
#abertura .caixa{display:grid;justify-items:center;gap:14px}

#abertura .msc-g svg{width:100%;height:100%;display:block}

.voltar{display:inline-flex;align-items:center;height:36px;margin:-10px 0 6px;color:var(--ink2);font-size:14px;font-weight:600}

.ex-btn{width:100%;text-align:left;margin-bottom:0!important}
.ex.fechado .av{width:36px;height:36px}

.set.ok{background:var(--s1) linear-gradient(var(--gema),var(--gema)) no-repeat 0 0/100% 100%}

const kgLev=v=>nf1.format(v)+" kg";
const pct=v=>Math.round(v)+"%";
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hoje=()=>iso(new Date());
const dt=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])};
const somaDias=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};
const diasEntre=(a,b)=>Math.round((dt(b)-dt(a))/864e5);
const dm=s=>s.slice(8,10)+"/"+s.slice(5,7);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null};
const r1=v=>Math.round(v*10)/10;
const exDe=slot=>EX.find(e=>slot===e.k||slot===e.k+"E"||slot===e.k+"D");
const slotsDe=e=>e.maos?[e.k+"E",e.k+"D"]:[e.k];
const ladoDe=slot=>/E$/.test(slot)&&exDe(slot).maos?"esquerda":/D$/.test(slot)&&exDe(slot).maos?"direita":"";
const fmtCarga=(e,v)=>e.lev?kgLev(v):kg(v);

/* ================= dados ================= */
function novo(){return {v:3,sessoes:{},pesos:[],cortes:JSON.parse(JSON.stringify(CORTES)),fases:{},carga:{}}}
function normalizar(d){
  const n=novo();
  n.sessoes=d.sessoes&&typeof d.sessoes==="object"?d.sessoes:{};
  n.pesos=Array.isArray(d.pesos)?d.pesos.filter(p=>p&&/^\d{4}-\d{2}-\d{2}$/.test(p.data)&&num(p.kg)):[];
  n.cortes=Object.assign(n.cortes,d.cortes||{});
  EX.forEach(e=>{const c=n.cortes[e.k];if(!Array.isArray(c)||c.length!==3||c.some(x=>num(x)===null))n.cortes[e.k]=CORTES[e.k].slice()});
  n.fases=d.fases||{}; n.carga=d.carga||{};
  n.ultimoBackup=/^\d{4}-\d{2}-\d{2}$/.test(d.ultimoBackup)?d.ultimoBackup:null;
  if(d.conq&&typeof d.conq==="object")n.conq=d.conq;
  if(Array.isArray(d.vistos))n.vistos=d.vistos;
  if(Array.isArray(d.conqPend))n.conqPend=d.conqPend;
  if(d.tutorial&&typeof d.tutorial==="object")n.tutorial=d.tutorial;
  return n;
}
function migrarV2(d,v2){
  if(!v2||!Array.isArray(v2.registros))return 0;
  let n=0;
  v2.registros.forEach(r=>{
    if(!r||String(r.id).indexOf("ex")===0||!/^\d{4}-\d{2}-\d{2}$/.test(r.data))return;
    if(r.tipo==="peso"&&num(r.kg)){d.pesos=d.pesos.filter(p=>p.data!==r.data);d.pesos.push({data:r.data,kg:num(r.kg)});n++;return}
    if((r.tipo==="dedos"||r.tipo==="barra")&&Array.isArray(r.series)){
      const s=sessao(d,r.data,true),slot=r.tipo==="dedos"?"maxhang":"barra";
      s.s[slot]=r.series.slice(0,3).map(c=>({c:num(c)||0,ok:true,t:r.criadoEm||0}));
      if(r.dor&&r.dor.pontos&&!Array.isArray(r.dor.pontos)&&Object.keys(r.dor.pontos).length)s.dor=Object.assign({},s.dor||{},r.dor.pontos);
      n++;return;
    }
    if(r.nivel||r.nota){const s=sessao(d,r.data,true);s.notaAntiga={nivel:r.nivel||"",nota:r.nota||""};n++}
  });
  d.pesos.sort((a,b)=>a.data<b.data?-1:1);
  return n;
}
function carregar(){
  try{const d=JSON.parse(localStorage.getItem(K3)||"null");if(d&&d.v===3)return normalizar(d)}catch(e){}
  const d=novo();
  try{const v2=JSON.parse(localStorage.getItem(K2)||"null");if(v2&&!v2.exemplo)migrarV2(d,v2)}catch(e){}
  gravar(d);
  return d;
}
function gravar(d){gravar.v=(gravar.v||0)+1;if(TOUR.ativo||gravar.desligado)return;try{localStorage.setItem(K3,JSON.stringify(d||D))}catch(e){if(!gravar.falhou){gravar.falhou=true;toast("Não consegui salvar no aparelho. Exporte um backup.")}}}
/* gravar.v conta as gravações: o render refaz a checagem de conquistas quando ela muda (e no
   primeiro render, que começa de render.v vazio) */
gravar.v=0;
function sessao(d,dia,criar){
  if(!d.sessoes[dia]&&criar)d.sessoes[dia]={s:{},esforco:null,dor:null};
  return d.sessoes[dia]||null;
}
const temSeries=s=>!!s&&Object.keys(s.s||{}).some(k=>(s.s[k]||[]).some(Boolean));
const datas=()=>Object.keys(D.sessoes).sort();

let D=carregar();
/* carga sem nenhuma série registrada volta a 0 (ajuste de + e − sem registrar não conta) */
(function(){let mudou=false;Object.keys(D.carga||{}).forEach(sl=>{
  const tem=Object.keys(D.sessoes).some(d=>((D.sessoes[d].s||{})[sl]||[]).some(Boolean));
  if(!tem){delete D.carga[sl];mudou=true}});if(mudou)gravar()})();
/* tutorial: quem já tem registros não recebe o tour sozinho (dá para rever em Ajustes) */
if(!D.tutorial){D.tutorial=datas().length||D.pesos.length?{treino:1,evolucao:1,agenda:1,ajustes:1}:{};gravar()}

/* ================= cálculos ================= */
function pesoEm(dia){
  if(!D.pesos.length)return null;
  let p=null;D.pesos.forEach(x=>{if(x.data<=dia)p=x.kg});
  return p===null?D.pesos[0].kg:p;
}
function pesoAtual(){return D.pesos.length?D.pesos[D.pesos.length-1]:null}
function rel(e,c,dia){const p=pesoEm(dia);if(!p)return null;return e.lev?c/p*100:(p+c)/p*100}
function nota(s,slot){const a=s&&s.s[slot];if(!a||a.length<3||!a.every(x=>x&&x.ok))return null;return Math.min.apply(null,a.map(x=>x.c))}
function valorSessao(s,slot){
  const a=(s&&s.s[slot])||[];const ok=a.filter(x=>x&&x.ok);
  if(!ok.length)return null;
  return {v:ok.reduce((t,x)=>t+x.c,0)/ok.length,cheio:ok.length===3};
}
function cargaAtual(slot){
  if(D.carga[slot]!==undefined&&num(D.carga[slot])!==null)return num(D.carga[slot]);
  const ds=datas().reverse();
  for(const d of ds){const a=(D.sessoes[d].s[slot]||[]).filter(Boolean);if(a.length)return a[a.length-1].c}
  return exDe(slot).ini;
}
function melhorNota(slot,excluir){
  let b=null;datas().forEach(d=>{if(d===excluir)return;const n=nota(D.sessoes[d],slot);if(n!==null&&(b===null||n>b))b=n});return b;
}
function melhorRelSlot(slot,desde,excluir){
  const e=exDe(slot);let b=null;
  datas().forEach(d=>{if(d===excluir||(desde&&d<desde))return;const n=nota(D.sessoes[d],slot);if(n===null)return;const r=rel(e,n,d);if(r!==null&&(b===null||r>b))b=r});
  return b;
}
function melhorRel(e,desde){
  const por={};const vs=[];
  slotsDe(e).forEach(sl=>{const r=melhorRelSlot(sl,desde);por[sl]=r;if(r!==null)vs.push(r)});
  return {rel:vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null,por};
}
function jaTestou(e){return datas().some(d=>slotsDe(e).some(sl=>nota(D.sessoes[d],sl)!==null))}
function faseDe(r,c){return r>=c[2]?3:r>=c[1]?2:r>=c[0]?1:0}
/* fase: sobe quando a marca bate o corte e só cai com ferrugem. Cada DIAS_ENF dias parado
   naquele exercício derruba uma fase, e as marcas de antes da parada deixam de contar. */
function progressoFase(e){
  if(!D.pesos.length||!jaTestou(e))return {f:null,rel:null};
  const c=D.cortes[e.k],slots=slotsDe(e);
  let f=null,melhor={},ant=null,fmax=0;
  const parada=g=>{const q=Math.floor(g/DIAS_ENF);if(q&&f!==null){f=Math.max(0,f-q);melhor={}}};
  datas().forEach(d=>{
    const s=D.sessoes[d];
    if(!slots.some(sl=>(s.s[sl]||[]).some(Boolean)))return;
    if(ant)parada(diasEntre(ant,d));ant=d;
    slots.forEach(sl=>{const n=nota(s,sl);if(n===null)return;const r=rel(e,n,d);if(r!==null&&(melhor[sl]===undefined||r>melhor[sl]))melhor[sl]=r});
    const vs=Object.keys(melhor).map(k=>melhor[k]);
    if(vs.length){const fr=faseDe(vs.reduce((a,b)=>a+b,0)/vs.length,c);f=f===null?fr:Math.max(f,fr);fmax=Math.max(fmax,f)}
  });
  if(ant)parada(diasEntre(ant,hoje()));
  const vs=Object.keys(melhor).map(k=>melhor[k]);
  return {f:f===null?0:f,rel:vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null,fmax:fmax};
}
function faseAtual(e){return progressoFase(e).f}
function ultimoTreino(e){
  const ds=datas().reverse();
  for(const d of ds){if(slotsDe(e).some(sl=>(D.sessoes[d].s[sl]||[]).some(Boolean)))return d}
  return null;
}
function enferrujado(e){const u=ultimoTreino(e);return !!u&&diasEntre(u,hoje())>=DIAS_ENF}
function dorRecente(){
  let m=0;const lim=somaDias(hoje(),-7);
  datas().forEach(d=>{if(d<lim)return;const p=D.sessoes[d].dor;if(p)Object.keys(p).forEach(k=>{m=Math.max(m,p[k])})});
  return m;
}
/* dia de treino: fortalecimento ou escalada */
const treinou=s=>temSeries(s)||!!(s&&s.escalada);
const MARCOS_SEQ=[3,7,14,21,30,50,75,100,150,200,365];
/* dias seguidos com treino. Hoje sem registro ainda não quebra (o dia não acabou);
   hoje registrado como descanso quebra na hora. */
function sequencia(){
  let d=hoje();if(!treinou(D.sessoes[d])){if(D.sessoes[d]&&D.sessoes[d].descanso)return 0;d=somaDias(d,-1)}
  let n=0;while(treinou(D.sessoes[d])){n++;d=somaDias(d,-1)}
  return n;
}
/* descanso: a partir do primeiro registro, dia que já passou sem treino (com ou sem registro)
   ou hoje registrado como descanso */
const descansou=d=>{const p=datas()[0];return !!p&&d>=p&&!treinou(D.sessoes[d])&&(d<hoje()||!!(D.sessoes[d]&&D.sessoes[d].descanso))};
function melhorSequencia(){
  let m=0,n=0,ant=null;
  datas().forEach(d=>{if(!treinou(D.sessoes[d]))return;n=ant&&somaDias(ant,1)===d?n+1:1;ant=d;if(n>m)m=n});
  return m;
}
function eventosSequencia(antes){
  if(U.dia!==hoje()||antes||!treinou(D.sessoes[U.dia]))return [];
  const n=sequencia();
  if(n>=2)U.chama=true;
  return MARCOS_SEQ.indexOf(n)>=0?[{tipo:"sequencia",n:n}]:[];
}
function estadoAve(e){
  const f=faseAtual(e);
  return {fase:f,enf:enferrujado(e),cur:dorRecente()>0};
}

function faiscas(el,n,cores,dist){
  if(RM||!el)return;
  const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(let k=0;k<n;k++){
    const f=document.createElement("i"),ang=Math.PI*2*k/n+Math.random()*.5,d=dist*(.6+Math.random()*.6);
    f.className="faisca";
    f.style.cssText="left:"+cx+"px;top:"+cy+"px;background:"+cores[k%cores.length]+";--dx:"+(Math.cos(ang)*d).toFixed(1)+"px;--dy:"+(Math.sin(ang)*d).toFixed(1)+"px";
    document.body.appendChild(f);setTimeout(()=>f.remove(),700);
  }
}
function contar(){
  document.querySelectorAll(".card .num").forEach(el=>{
    const tn=el.firstChild;if(!tn||tn.nodeType!==3)return;
    const m=tn.nodeValue.match(/^(\d+)%$/);if(!m)return;
    const alvo=+m[1],t0=performance.now();
    const f=t=>{const k=Math.min(1,(t-t0)/800),e=1-Math.pow(1-k,3);tn.nodeValue=Math.round(alvo*e)+"%";if(k<1&&tn.isConnected)requestAnimationFrame(f)};
    tn.nodeValue="0%";requestAnimationFrame(f);
  });
}
let tEntra;
function posRender(mesma){
  if(!mesma&&!RM){
    const app=$("#app");app.classList.remove("entra");void app.offsetWidth;app.classList.add("entra");
    clearTimeout(tEntra);tEntra=setTimeout(()=>app.classList.remove("entra"),1400);
    document.querySelectorAll("nav .salta").forEach(x=>x.classList.remove("salta"));
    const nb=document.querySelector("nav [aria-current=page]");if(nb){void nb.offsetWidth;nb.classList.add("salta")}
    if(U.tela==="evolucao")contar();
  }
  const fx=U.fx;U.fx=null;
  if(fx&&fx.falha&&U.tela==="treino")animarFalha(fx.slot);
  if(fx&&fx.novo&&U.tela==="treino"){
    const b=document.querySelector(fx.i==="all"?'[data-a=feito][data-s="'+fx.slot+'"]':'[data-a=set][data-s="'+fx.slot+'"][data-i="'+fx.i+'"]');
    faiscas(b,9,U.dia===hoje()?["#FFC83D","#fff3c4"]:["#7EC8E3","#d9f1fa"],34);
    const sec=b&&b.closest(".ex"),selo=sec&&sec.querySelector(".selo");
    if(selo){
      selo.classList.add("novo");
      if(!RM){sec.classList.remove("completa");void sec.offsetWidth;sec.classList.add("completa")}
      const av=sec.querySelector(".av");
      if(av&&!RM){av.classList.add("festa");faiscas(av,16,["#FFC83D","#E84855","#3BB273","#7EC8E3","#F7F4EC"],70)}
      if(navigator.vibrate)try{navigator.vibrate([15,50,15,50,30])}catch(x){}
    }
  }
}

function grafico(e){
  const cortes=D.cortes[e.k],ser=[];
  slotsDe(e).forEach((sl,j)=>{
    const pts=[];datas().forEach(d=>{const v=valorSessao(D.sessoes[d],sl);if(!v)return;const r=rel(e,v.v,d);if(r!==null)pts.push({d:d,v:r,cheio:v.cheio})});
    ser.push({pts:pts.slice(-24),cor:j?"#8a867d":"#f3f0e9",nome:e.maos?(j?"Dir":"Esq"):""});
  });
  const todos=[].concat.apply([],ser.map(x=>x.pts));
  if(!todos.length)return '<p class="vazio">'+(D.pesos.length?"Faça as 3 séries para aparecer aqui.":"Registre seu peso para ver o gráfico.")+'</p>';
  const W=340,H=160,m={l:30,r:50,t:10,b:22},pw=W-m.l-m.r,ph=H-m.t-m.b;
  const vs=todos.map(p=>p.v).concat(cortes);
  let lo=Math.floor((Math.min.apply(null,vs)-4)/5)*5,hi=Math.ceil((Math.max.apply(null,vs)+4)/5)*5;
  const Y=v=>m.t+ph-(v-lo)/(hi-lo)*ph;
  const ds=[...new Set(todos.map(p=>p.d))].sort(),t0=dt(ds[0]).getTime(),t1=dt(ds[ds.length-1]).getTime();
  const X=d=>t1===t0?m.l+pw/2:m.l+(dt(d).getTime()-t0)/(t1-t0)*pw;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução de '+e.nome+' em % do peso">';
  cortes.forEach((c,i)=>{s+='<line class="corte" x1="'+m.l+'" x2="'+(W-m.r+4)+'" y1="'+Y(c)+'" y2="'+Y(c)+'"/><text class="ax" x="'+(W-m.r+8)+'" y="'+(Y(c)+4)+'">'+FASES_CURTO[i+1]+'</text>'});
  [lo,hi].forEach(v=>{s+='<text class="ax" x="'+(m.l-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>'});
  s+='<text class="ax" x="'+m.l+'" y="'+(H-4)+'">'+dm(ds[0])+'</text>';
  if(ds.length>1)s+='<text class="ax" x="'+(W-m.r)+'" y="'+(H-4)+'" text-anchor="end">'+dm(ds[ds.length-1])+'</text>';
  ser.forEach(x=>{
    if(x.pts.length>1)s+='<path d="'+x.pts.map((p,i)=>(i?"L":"M")+r1(X(p.d))+" "+r1(Y(p.v))).join(" ")+'" fill="none" stroke="'+x.cor+'" stroke-width="2" stroke-linejoin="round"/>';
    x.pts.forEach(p=>{s+='<circle cx="'+r1(X(p.d))+'" cy="'+r1(Y(p.v))+'" r="3.8" fill="'+(p.cheio?x.cor:"#000")+'" stroke="'+x.cor+'" stroke-width="2"/>'});
  });
  s+='</svg>';
  if(e.maos)s+='<p class="sec-sub" style="margin-top:6px"><span class="dot" style="background:#f3f0e9;margin:0 5px 0 0"></span>Esquerda <span class="dot" style="background:#8a867d;margin:0 5px 0 12px"></span>Direita</p>';
  return s;
}
function graficoSemana(){
  const ds=datas();if(!ds.some(d=>temEsf(D.sessoes[d])))return '<p class="vazio">Registre a intensidade do fortalecimento ao fim de cada treino para ver a carga da semana.</p>';
  const seg=d=>{const x=dt(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)};
  let ini=seg(ds[0]);const fimSem=seg(hoje());
  if(diasEntre(ini,fimSem)<49)ini=somaDias(fimSem,-49);
  const sem=[];for(let d=ini;d<=fimSem;d=somaDias(d,7))sem.push({ini:d,fim:somaDias(d,6),esf:0,dor:0});
  ds.forEach(d=>{const w=sem.find(x=>d>=x.ini&&d<=x.fim);if(!w)return;const s=D.sessoes[d];if(temEsf(s))w.esf+=s.esforco;
    if(s.dor)Object.keys(s.dor).forEach(k=>{w.dor=Math.max(w.dor,s.dor[k])})});
  const sl=42,H=160,m={t:18,b:24},ph=H-m.t-m.b,W=sem.length*sl+8,mx=Math.max(10,Math.max.apply(null,sem.map(x=>x.esf))),bw=24;
  let s='<svg class="px" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Soma da intensidade do fortalecimento por semana">';
  s+='<line class="gl" x1="0" x2="'+W+'" y1="'+(m.t+ph)+'" y2="'+(m.t+ph)+'"/>';
  sem.forEach((w,i)=>{
    const cx=4+sl*i+sl/2,h=w.esf/mx*ph,y=m.t+ph-h;
    if(w.esf)s+='<rect x="'+r1(cx-bw/2)+'" y="'+r1(y)+'" width="'+bw+'" height="'+r1(Math.max(h,2))+'" rx="4" fill="'+(i===sem.length-1?"#f3f0e9":"#4a4842")+'"/><text class="ax" x="'+cx+'" y="'+r1(y-5)+'" text-anchor="middle">'+w.esf+'</text>';
    s+='<text class="ax" x="'+cx+'" y="'+(H-4)+'" text-anchor="middle">'+dm(w.ini)+'</text>';
    if(w.dor)s+='<circle cx="'+cx+'" cy="'+(m.t+ph+7)+'" r="3.5" fill="var(--d'+w.dor+')"/>';
  });
  return '<div class="rolagem-x" id="r-semana">'+s+'</svg></div>';
}
function graficoPeso(){
  const ps=D.pesos;if(ps.length<2)return ps.length?'<p class="vazio">Registre mais um peso para ver a linha de evolução.</p>':"";

/* conquistas batidas juntas viram uma comemoração só ({ids}); se a última da fila já é de
   conquistas, as novas entram nela */
function filaConquistas(ids){
  if(!ids.length)return;
  const ult=U.fila[U.fila.length-1];
  if(ult&&ult.tipo==="conquista"&&U.fila.length>1){ult.ids=ult.ids.concat(ids.filter(k=>ult.ids.indexOf(k)<0));return}
  U.fila.push({tipo:"conquista",ids:ids});
}
/* acompanha o histórico: conquista nova entra na fila de comemoração (uma vez por uso do app)
   e, se o registro que a gerou for excluído, ela volta a ficar bloqueada.
   segurar=true: veio do treino (séries ou sessão). Fica em D.conqPend e só é comemorada ao
   salvar a sessão, depois das cenas de fortalecimento, dor e escalada.
   Na primeira vez (ou depois de importar um backup sem conquistas) guarda tudo sem comemorar. */
function checarConquistas(segurar){
  const R=calcConquistas(),primeira=!D.conq;let mudou=primeira;
  if(primeira)D.conq={};
  /* "De volta à ativa" virou "Ressuscitou": quem já tinha a antiga não comemora de novo */
  if(D.conq.volta){if(!D.conq.ressuscitou)D.conq.ressuscitou=D.conq.volta;delete D.conq.volta;mudou=true}
  const novas=[];
  Object.keys(CHAVE_CONQ).forEach(k=>{const r=R[k],d=r&&r.data,tinha=D.conq[k];
    if(!d){if(tinha){delete D.conq[k];mudou=true}return}
    if(tinha===d)return;
    D.conq[k]=d;mudou=true;
    if(!tinha&&!primeira&&!celebrados.has("conq:"+k))novas.push(k)});
  const topo=novas.filter(conqNoTopo);topo.forEach(k=>celebrados.add("conq:"+k));
  if(!segurar)filaConquistas(topo);
  else topo.forEach(k=>{if((D.conqPend=D.conqPend||[]).indexOf(k)<0)D.conqPend.push(k)});
  if(mudou)gravar();
  return R;
}

/* ================= folhas ================= */
function chaveSeg(mao,ds){const q=ds.split(".");return mao+":"+DEDO_NOME[q[0]]+":"+SEG_NOME[q[1]]}
function corSeg(ds,n){const a=ARTIC[ds.split(".")[1]];return {f:n?"var(--d"+n+")":(a?"var(--line)":"transparent"),o:n?(a?1:.93):(a?.55:1)}}
/* desenho de cada mão montado uma vez só: o template já vem cortado nos pontos onde entra a cor
   de cada segmento (posições ímpares), e a cada desenho só se juntam os pedaços */
const MAO_PRONTA={};
function maoPronta(mao){
  if(MAO_PRONTA[mao])return MAO_PRONTA[mao];
  const L=mao==="esquerda";
  const tpl=MAO_TPL.replace(/@L@/g,L?"E":"D").replace(/@LN@/g,mao).replace("<g@MIR@>",L?'<g transform="translate(276,0) scale(-1,1)">':"<g>")
    .replace(/data-h="([\w.]+)"/g,(m,ds)=>'data-v="'+chaveSeg(mao,ds)+'"');
  return MAO_PRONTA[mao]=tpl.split(/data-seg="([\w.]+)"/).map((x,i)=>i%2?{ds:x,k:chaveSeg(mao,x)}:x);
}
function mapaMao(mao){
  const pd=maoPronta(mao);let corpo=pd[0];
  for(let i=1;i<pd.length;i+=2){const q=pd[i],c=corSeg(q.ds,U.dorP[q.k]||0);corpo+='data-seg="'+q.k+'" fill="'+c.f+'" opacity="'+c.o+'"'+pd[i+1]}
  return '<svg class="mao-svg" viewBox="-6 84 288 330" role="group" aria-label="Mão '+mao+'">'+corpo+'</svg>';
}
function contaMao(mao){return Object.keys(U.dorP).filter(k=>k.indexOf(mao+":")===0).length}
function abaMao(mao,rot){const n=contaMao(mao);return '<button data-a="mao" data-v="'+mao+'" aria-pressed="'+(U.mao===mao)+'">'+rot+(n?' <span class="qtd">'+n+'</span>':"")+'</button>'}
/* toque na mão: atualiza só as cores, sem redesenhar a folha inteira */
function tocarDor(k){
  const n=((U.dorP[k]||0)+1)%4;if(n)U.dorP[k]=n;else delete U.dorP[k];U.erro="";
  document.querySelectorAll('[data-seg="'+k+'"]').forEach(el=>{
    const q=k.split(":"),ds=Object.keys(DEDO_NOME).find(x=>DEDO_NOME[x]===q[1])+"."+Object.keys(SEG_NOME).find(x=>SEG_NOME[x]===q[2]);

/* título, texto e desenho de cada evento (usado nas comemorações e na tela do dia da Agenda) */

    if(ms.length===1){const m=ms[0];
      tit=m.i>0?"Subiu de nível!":"Conquista!";txt=m.c.n+(m.i>=0?" · "+NIVEIS[m.i]:"")+": "+m.x.d;
      arte='<div class="moeda-w"><div class="raios"></div>'+moeda(m,{g:1})+'</div>'}
    else{
      /* várias no mesmo registro: as medalhas lado a lado, virando uma depois da outra */
      tit=ms.length+" conquistas!";txt="Tudo isso num registro só. Toque numa medalha no Histórico para ver os detalhes.";
      arte='<div class="moeda-w varias'+(ms.length>4?" muitas":"")+'"><div class="raios"></div>'+ms.map(m=>'<div class="moeda-i">'+moeda(m,{})+

  else if(ev.tipo==="sequencia"){tit="Dias seguidos";txt="Você treinou "+ev.n+" dias em sequência.";arte='<svg class="chamao" viewBox="0 0 24 30" aria-hidden="true">'+CHAMA.replace(/^<svg[^>]*>|<\/svg>$/g,"")+'</svg><p class="contagem">'+ev.n+'</p>'}

/* escolha simples na folha (nota, tempo, intensidade): só troca o botão marcado, sem redesenhar
   a folha inteira (nem o desenho da mão, quando aberto) */
function escolher(a,v){
  document.querySelectorAll('.folha [data-a="'+a+'"]').forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===v)));
  const er=document.querySelector(".folha .erro");if(er)er.remove();
  selPop(a,v);
}
function selPop(a,v){
  const el=document.querySelector('.folha [data-a="'+a+'"][data-v="'+v+'"]');if(!el)return;
  el.classList.remove("sel-pop");void el.offsetWidth;el.classList.add("sel-pop");
  faiscas(el,7,U.dia===hoje()?["#FFC83D","#fff3c4"]:["#7EC8E3","#d9f1fa"],26);

/* troca só os blocos da tela que mudaram: o resto fica como está, e os frangos seguem piscando
   e balançando sem recomeçar a animação a cada toque. tudo=true redesenha tudo (troca de tela). */
function trocarBlocos(el,html,tudo){
  const t=document.createElement("template");t.innerHTML=html;
  const novos=Array.from(t.content.childNodes),chaves=novos.map(n=>n.nodeType===1?n.outerHTML:n.nodeValue),vivos=Array.from(el.childNodes);
  if(tudo||!el._chaves||el._chaves.length!==novos.length||vivos.length!==novos.length)el.replaceChildren(t.content);
  else novos.forEach((n,i)=>{if(chaves[i]!==el._chaves[i])vivos[i].replaceWith(n)});
  el._chaves=chaves;
}

  if(!nav.firstChild)nav.innerHTML=[["agenda","Histórico"],["treino","Treino"],["evolucao","Evolução"]].map(t=>'<button data-a="tela" data-v="'+t[0]+'"'+(t[0]==="treino"?' class="centro"':"")+'>'+ICONES[t[0]]+t[1]+'</button>').join("");

}

/* ================= botão voltar do celular =================
   Cada tela, janela ou dia visitado vira um passo no histórico: voltar leva ao anterior.
   Na primeira tela, voltar pergunta antes de sair do app. */
const Nav={ult:null,quieto:false};
const navChave=()=>JSON.stringify([U.tela,U.card,U.folha,U.dia,U.modo,U.mes]);
function navGuardar(){
  if(Nav.quieto||TOUR.ativo||!history.pushState)return;
  const k=navChave();if(k===Nav.ult)return;
  Nav.ult=k;try{history.pushState({v:{tela:U.tela,card:U.card,dia:U.dia,modo:U.modo,mes:U.mes}},"")}catch(x){}
}
function navQuieto(){Nav.quieto=true;render();Nav.quieto=false;Nav.ult=navChave();try{history.pushState({v:{tela:U.tela,card:U.card,dia:U.dia,modo:U.modo}},"")}catch(x){}}
window.addEventListener("popstate",ev=>{
  /* o tutorial ocupa um passo do histórico: voltar fecha o tutorial */
  if(TOUR.ignorarPop){TOUR.ignorarPop=false;return}
  if(TOUR.ativo){tourFechar("voltar");return}
  const st=ev.state;
  if(!st||st.raiz){
    if(U.folha==="sair"){history.back();return}          /* voltar de novo com a pergunta aberta: sai */
    U.fila=[];U.folha="sair";U.abre=true;navQuieto();return;
  }
  if(U.fila.length){U.fila.shift();navQuieto();return}    /* voltar fecha a comemoração */
  const antes=navChave(),v=st.v||{};
  U.tela=v.tela||"treino";U.card=v.card||null;U.mes=v.mes||null;U.dia=v.dia&&v.dia<=hoje()?v.dia:hoje();U.modo=v.modo||null;U.folha=null;U.imp=null;
  if(navChave()===antes){history.back();return}           /* passo repetido: pula */
  Nav.quieto=true;render();Nav.quieto=false;Nav.ult=navChave();
});

    const marca=(a,v)=>document.querySelectorAll('.folha [data-a="'+a+'"]').forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===v)));
    const volta=()=>{marca("esc-min",String(U.escMin));marca("esc-int",U.escInt);[sim,t2,forte].forEach(b=>b.classList.remove("tour-aperta"))};
    TOUR.desfaz=volta;
    tourAnima([
      [500,()=>{volta();dedoEntra(sim,30,14)}],
      [650,()=>{dedoToca(sim);selPop("esc","1")}],
      [800,()=>dedoIr(t2,30,14)],
      [650,()=>{dedoToca(t2);marca("esc-min","120");selPop("esc-min","120")}],
      [800,()=>dedoIr(forte,90,10)],
      [650,()=>{dedoToca(forte);marca("esc-int","intensa");selPop("esc-int","intensa");tourFaiscas(forte,9,["#FFC83D","#fff3c4"],34)}],
      [1700,dedoSai]
    ],true);
  }
};
function tourLimites(){
  const t=document.querySelector(".topo.fixo"),n=document.querySelector("nav");
  return {cima:t?Math.max(0,t.getBoundingClientRect().bottom):0,baixo:n?n.getBoundingClientRect().top:innerHeight};
}
/* rola até o item e só mostra o balão quando a rolagem para */
function tourRolar(y,cb){
  const max=document.documentElement.scrollHeight-innerHeight;
  y=Math.max(0,Math.min(max,Math.round(y)));
  if(Math.abs(y-window.scrollY)<2)return setTimeout(cb,120);
  window.scrollTo({top:y,behavior:RM?"auto":"smooth"});
  let ult=-1,iguais=0;const t0=performance.now();
  const f=()=>{const a=window.scrollY;iguais=Math.abs(a-ult)<.5?iguais+1:0;ult=a;
    if(iguais>=4||performance.now()-t0>1000)cb();else requestAnimationFrame(f)};
  requestAnimationFrame(f);
}
function tourConteudo(){
  const p=TOUR.passos[TOUR.i],n=TOUR.passos.length,bal=$(".tour-balao");
  if(p.so){bal.innerHTML='<h2 id="tour-t">'+p.t+'</h2><div class="tour-pe"><button class="tour-ok" data-t="ok">'+(p.ok||"Entendi")+'</button></div>';return}
  const ant=TOUR.i>0&&TOUR.passos[TOUR.i-1];
  const corpo=p.varios?'<ul class="tour-lista">'+TOUR.vis.map((o,i)=>'<li><button data-t="vai" data-v="'+i+'" aria-pressed="'+(i===TOUR.vi)+'"'+(i===TOUR.vi?' class="on"':'')+'><b>'+o.q.r+'</b><span>'+o.q.x+'</span></button></li>').join("")+'</ul>'
    :p.x.split("\n\n").map(t=>'<p>'+t+'</p>').join("");
  bal.innerHTML='<div class="tour-cab"><div class="tour-av">'+(p.ovo?ovo():ave({cor:"#FFC83D"},{fase:p.fase===undefined?1:p.fase}))+'</div>'+
    '<div><span class="tour-tag">Passo '+(TOUR.i+1)+' de '+n+'</span><h2 id="tour-t">'+p.t+'</h2></div></div>'+corpo+
    '<div class="tour-pe">'+(TOUR.i<n-1?'<button class="tour-pular" data-t="pular">'+(tourCentro(p)?"Pular tutorial":"Pular")+'</button>':'<span class="tour-pular"></span>')+
    (ant&&!tourCentro(ant)?'<button class="tour-volta" data-t="volta">Voltar</button>':"")+
    '<button class="tour-ok" data-t="ok">'+(p.ok||"Entendi")+'</button></div><i class="tour-seta" aria-hidden="true"></i>';
}
/* recorte de luz em volta do item e balão acima ou abaixo, onde couber */
function tourPos(){
  if(!TOUR.ativo)return;
  const p=TOUR.passos[TOUR.i],luz=$(".tour-luz"),bal=$(".tour-balao"),seta=bal.querySelector(".tour-seta"),el=TOUR.el;
  const vw=document.documentElement.clientWidth,vh=innerHeight;
  bal.classList.toggle("so",!!p.so);
  if(!el||!tourPrim(el).isConnected){
    luz.className="tour-luz nada";Object.assign(luz.style,{top:vh/2+"px",left:vw/2+"px",width:"0px",height:"0px"});
    bal.classList.add("centro");if(seta)seta.hidden=true;
    bal.style.left=Math.max(16,(vw-bal.offsetWidth)/2)+"px";bal.style.top=Math.max(12,(vh-bal.offsetHeight)/2)+"px";
    return;
  }
  bal.classList.remove("centro");luz.className="tour-luz";if(seta)seta.hidden=!!p.varios;
  const r=tourCaixa(el),pad=6,bh=bal.offsetHeight,bw=bal.offsetWidth,lim=tourLimites(),fixo=tourPrim(el).closest("nav,.topo.fixo");
  const x=Math.max(4,r.left-pad),w=Math.min(vw-4,r.right+pad)-x,y=r.top-pad;let h=r.height+pad*2;
  /* item que não deixa lugar para o balão nem em cima nem embaixo: ilumina só o começo */
  if(!fixo&&!p.varios&&Math.max(y-lim.cima,lim.baixo-(y+h))<bh+14)h=Math.min(h,Math.max(90,lim.baixo-Math.max(y,lim.cima)-bh-30));
  Object.assign(luz.style,{top:y+"px",left:x+"px",width:w+"px",height:h+"px"});
  /* vários itens: o balão fica parado (no meio, ou do lado oposto ao item quando a tela rola) e só o recorte anda */
  if(p.varios){
    if(p.rola&&!TOUR.lado)TOUR.lado=lim.baixo-r.bottom>=r.top-lim.cima?"baixo":"cima";
    const topo=!p.rola?(vh-bh)/2:TOUR.lado==="baixo"?lim.baixo-12-bh:lim.cima+12;
    bal.style.left=Math.max(16,(vw-bw)/2)+"px";bal.style.top=Math.max(8,Math.round(topo))+"px";return;
  }
  const cx=x+w/2,bx=Math.max(16,Math.min(vw-16-bw,cx-bw/2));
  const abaixo=vh-8-(y+h),acima=y-8,emBaixo=abaixo>=bh+14||abaixo>=acima;
  const by=Math.max(8,Math.min(vh-8-bh,emBaixo?y+h+14:y-14-bh));
  bal.style.left=bx+"px";bal.style.top=by+"px";
  if(seta){seta.className="tour-seta "+(emBaixo?"cima":"baixo");seta.style.left=Math.max(22,Math.min(bw-22,cx-bx))+"px"}
}
function tourTecla(ev){
  if(ev.key==="Escape"){ev.preventDefault();tourFechar("fecha")}
  else if(ev.key==="ArrowRight"){ev.preventDefault();tourPasso(1)}
  else if(ev.key==="ArrowLeft"){ev.preventDefault();tourPasso(-1)}
}
document.addEventListener("click",ev=>{
  if(!TOUR.ativo)return;
  const b=ev.target.closest("[data-t]");
  if(!b){
    /* toque fora do balão não avança: o balão dá uma sacudida para chamar atenção */
    if(ev.target.closest(".tour-bloq")&&!RM){const bal=$(".tour-balao");bal.classList.remove("entra","cutuca");void bal.offsetWidth;bal.classList.add("cutuca")}
    return;
  }
  const a=b.dataset.t;
  if(a==="ok")tourPasso(1);else if(a==="volta")tourPasso(-1);else if(a==="pular")tourFechar("pular");
  else if(a==="vai"){tourVai(Number(b.dataset.v));tourCiclo()}
});
/* captura: também acompanha a rolagem de dentro das janelas */
{let raf=0;const pos=()=>{if(!TOUR.ativo||raf)return;raf=requestAnimationFrame(()=>{raf=0;tourPos()})};
  window.addEventListener("resize",pos);window.addEventListener("scroll",pos,{passive:true,capture:true})}

/* ================= abertura: frango evoluindo ================= */
function abertura(){
  const el=$("#abertura");if(!el)return;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches){el.remove();tourTalvez();return}
  el.innerHTML='<div class="caixa"><div class="msc-g">'+ave({cor:"#FFC83D"},{fase:0,todas:true})+'</div><h1>Diário do<br>Escalador Frango</h1><p class="nome-fase">'+FASES[0]+'</p><div class="passos"><i class="on"></i><i></i><i></i><i></i></div></div>';
  const svg=el.querySelector("svg"),bu=svg.querySelector(".burst");bu.setAttribute("stroke","#fff");
  let f=0,fim=false;const ts=[];
  const trocar=n=>{
    svg.querySelectorAll(".st").forEach(g=>{g.classList.remove("on","pop");if(+g.dataset.f===n){g.classList.add("on");void g.getBBox();g.classList.add("pop")}});
    bu.classList.remove("go");void bu.getBBox();bu.classList.add("go");
    el.querySelector(".nome-fase").textContent=FASES[n];
    el.querySelectorAll(".passos i").forEach((x,i)=>x.classList.toggle("on",i<=n));
  };
  const fechar=()=>{if(fim)return;fim=true;ts.forEach(clearTimeout);el.classList.add("sai");setTimeout(()=>{el.remove();tourTalvez()},480)};
  for(let n=1;n<=3;n++)ts.push(setTimeout(()=>trocar(n),n*620));
  ts.push(setTimeout(fechar,3*620+900));
  el.addEventListener("click",fechar);
}
