    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

      // and sender identity (own child frame / direct parent) is checked

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&

      ';</' + 'script>';

    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');

        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

g:.14em;text-transform:uppercase;color:var(--ink3)\">Direita<\u002Fspan>\n                        <span style=\"font-size:11.5px;color:var(--ink2);text-align:center;line-height:1.35\">{{ sheet.dir.resumo }}<\u002Fspan>\n                      <\u002Fdiv>\n\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center\">\n                    <sc-for list=\"{{ sheet.legenda }}\" as=\"l\" hint-placeholder-count=\"3\">\n                      <span style=\"display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2)\">\n                        <span style=\"width:11px;height:11px;border-radius:3px;background:{{ l.cor }};border:1px solid var(--ink)\"><\u002Fspan>\n                        {{ l.rotulo }}\n                      <\u002Fspan>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ sheet.erro.tem }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0;font-size:12.5px;color:var(--warn)\">{{ sheet.erro.texto }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:10px;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px))\">\n          <sc-if value=\"{{ sheet.podeExcluir }}\" hint-placeholder-val=\"{{ false }}\">\n            <button type=\"button\" sc-camel-on-click=\"{{ sheet.onExcluir }}\" style=\"padding:15px 18px;border:1.5px solid var(--line);color:var(--ink2);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase\" style-hover=\"border-color:var(--warn);color:var(--warn)\">{{ sheet.rotuloExcluir }}<\u002Fbutton>\n          <\u002Fsc-if>\n          <button type=\"button\" sc-camel-on-click=\"{{ sheet.onSalvar }}\" style=\"flex:1;background:var(--ink);color:var(--inv);padding:15px;font-family:'Bebas Neue',Impact,sans-serif;font-size:22px;letter-spacing:.09em;text-transform:uppercase\" style-hover=\"opacity:.86\">Salvar<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toast.tem }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:50%;transform:translateX(-50%);bottom:130px;background:var(--ink);color:var(--inv);padding:10px 18px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;z-index:40;animation:surgir .18s ease\">{{ toast.texto }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:880},&quot;tema&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;claro&quot;,&quot;escuro&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Aparência&quot;},&quot;heroi&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;relativa&quot;,&quot;carga&quot;],&quot;default&quot;:&quot;relativa&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Aparência&quot;},&quot;agarraPadrao&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;min&quot;:8,&quot;max&quot;:30,&quot;unit&quot;:&quot;mm&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Registro&quot;},&quot;dadosExemplo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Registro&quot;}}\">\n/* ============================================================\n   DIÁRIO DE ESCALADA\n   Para adicionar uma nova métrica: acrescente uma entrada em\n   this.METRICAS e, se ela tiver campos próprios, em camposDe().\n   Home, gráficos, metas, histórico e backup leem tudo daqui.\n   ============================================================ */\nclass Component extends DCLogic {\n  CHAVE = \"diario-escalada-v2\";\n\n  METRICAS = [\n    { chave:\"dedos\", nome:\"Dedos\", titulo:\"Força de dedos\", sub:\"Max hang · 3 séries · 20 mm · 10 s\",\n      descanso:\"3 min\",\n      unidade:\"kg\", casas:1, maisMelhor:true, series:true, valor:r=>r.carga,\n      detalhe:r=>\"3 séries · 20 mm · 10 s\" },\n    { chave:\"barra\", nome:\"Barra\", titulo:\"Força de puxada\", sub:\"Barra fixa · 3 séries · 5 repetições\",\n      descanso:\"3 min\",\n      unidade:\"kg\", casas:1, maisMelhor:true, series:true, valor:r=>r.carga,\n      detalhe:r=>\"3 séries · 5 repetições\" },\n    { chave:\"peso\", nome:\"Peso\", titulo:\"Peso corporal\", sub:\"Base da força relativa\",\n      unidade:\"kg\", casas:1, maisMelhor:false, valor:r=>r.kg, detalhe:()=>\"\" }\n  ];\n\n  DEDOS = [\"Polegar\",\"Indicador\",\"Médio\",\"Anelar\",\"Mínimo\"];\n  CHAVES_DEDO = {polegar:\"Polegar\", indicador:\"Indicador\", medio:\"Médio\",\n    anelar:\"Anelar\", minimo:\"Mínimo\"};\n  /* segmentos de cada dedo, da ponta até a base: falanges (\"f\") e articulações (\"a\").\n     O polegar tem 2 falanges e 2 articulações (IP, MCP); os outros dedos têm 3 falanges e 3 articulações\n     (DIP, PIP, MCP). A chave salva é \"lado:Dedo:Segmento\" (ex.: \"direita:Anelar:Proximal\" ou\n     \"direita:Anelar:PIP\"). Registros antigos, sem segmento (\"direita:Anelar\"), continuam válidos. */\n  SEGMENTOS = {\"polegar\": [[\"distal\", \"Distal\", \"f\"], [\"ip\", \"IP\", \"a\"], [\"proximal\", \"Proximal\", \"f\"], [\"mcp\", \"MCP\", \"a\"]], \"indicador\": [[\"distal\", \"Distal\", \"f\"], [\"dip\", \"DIP\", \"a\"], [\"media\", \"Média\", \"f\"], [\"pip\", \"PIP\", \"a\"], [\"proximal\", \"Proximal\", \"f\"], [\"mcp\", \"MCP\", \"a\"]], \"medio\": [[\"distal\", \"Distal\", \"f\"], [\"dip\", \"DIP\", \"a\"], [\"media\", \"Média\", \"f\"], [\"pip\", \"PIP\", \"a\"], [\"proximal\", \"Proximal\", \"f\"], [\"mcp\", \"MCP\", \"a\"]], \"anelar\": [[\"distal\", \"Distal\", \"f\"], [\"dip\", \"DIP\", \"a\"], [\"media\", \"Média\", \"f\"], [\"pip\", \"PIP\", \"a\"], [\"proximal\", \"Proximal\", \"f\"], [\"mcp\", \"MCP\", \"a\"]], \"minimo\": [[\"distal\", \"Distal\", \"f\"], [\"dip\", \"DIP\", \"a\"], [\"media\", \"Média\", \"f\"], [\"pip\", \"PIP\", \"a\"], [\"proximal\", \"Proximal\", \"f\"], [\"mcp\", \"MCP\", \"a\"]]};\n  /* converte chaves antigas (dedo inteiro) em uma chave por falange, para poder editar */\n  expandirDor(p){\n    const o={};\n    Object.keys(p||{}).forEach(k=>{\n      const partes=k.split(\":\");\n      if(partes.length>=3){ o[k]=p[k]; return; }\n      const dk=Object.keys(this.CHAVES_DEDO).filter(x=>this.CHAVES_DEDO[x]===partes[1])[0];\n      if(!dk){ o[k]=p[k]; return; }\n      this.SEGMENTOS[dk].filter(s=>s[2]===\"f\").forEach(s=>{\n        const nk=partes[0]+\":\"+partes[1]+\":\"+s[1]; if(!o[nk]) o[nk]=p[k]; });\n    });\n    return o;\n  }\n  nomeSeg(rot){ return /^[A-Z]{2,3}$/.test(rot) ? rot : rot.toLowerCase(); }\n  mapaMao(mao, f){\n    const sel=(f&&f.dorPontos)||{};\n    const m={};\n    Object.keys(this.CHAVES_DEDO).forEach(k=>{\n      m[k]={};\n      this.SEGMENTOS[k].forEach(s=>{\n        const chave=mao+\":\"+this.CHAVES_DEDO[k]+\":\"+s[1], nivel=sel[chave]||0;\n        m[k][s[0]]={ fundo: nivel?this.corDor(nivel):(s[2]===\"a\"?\"var(--line)\":\"transparent\"),\n          opac: nivel?(s[2]===\"a\"?1:0.93):(s[2]===\"a\"?0.55:1),\n          onClick:()=>this.setState(st=>{\n            const o=Object.assign({},st.form.dorPontos||{});\n            const prox=((o[chave]||0)+1)%4;\n            if(prox) o[chave]=prox; else delete o[chave];\n            return {form:Object.assign({},st.form,{dorPontos:o})}; }) };\n      });\n    });\n    const nomes=[], niv=n=>this.INTENSIDADES[n-1]||\"\";\n    Object.keys(this.CHAVES_DEDO).forEach(k=>{\n      const d=this.CHAVES_DEDO[k], segs=this.SEGMENTOS[k], ch=s=>mao+\":\"+d+\":\"+s[1];\n      if(sel[mao+\":\"+d]) nomes.push(d+\" · \"+niv(sel[mao+\":\"+d]));\n      const fal=segs.filter(s=>s[2]===\"f\"), v=fal.map(s=>sel[ch(s)]||0);\n      const todas=v.every(x=>x>0 && x===v[0]);\n      if(todas) nomes.push(d+\" (falanges) · \"+niv(v[0]));\n      segs.forEach(s=>{ if(sel[ch(s)] && !(todas && s[2]===\"f\"))\n        nomes.push(d+\" \"+this.nomeSeg(s[1])+\" · \"+niv(sel[ch(s)])); });\n    });\n    m.resumo=nomes.length?nomes.join(\"  |  \"):\"—\";\n    return m;\n  }\n  INTENSIDADES = [\"leve\",\"moderada\",\"aguda\"];\n  corDor(n){ return n>=3?\"var(--warn)\":n===2?\"#c08a2e\":\"var(--ink3)\"; }\n  /* dor.pontos: { \"esquerda:Anelar:Distal\": 1..3 } — a intensidade é por falange/articulação (chaves antigas \"esquerda:Anelar\" = dedo inteiro) */\n  pontosDor(d){\n    if(!d) return {};\n    const p=d.pontos;\n    if(p && !Array.isArray(p)) return p;\n    const o={}, base=d.intensidade||1;\n    (Array.isArray(p)?p:(d.dedos||[]).map(x=>(d.mao===\"esquerda\"?\"esquerda\":\"direita\")+\":\"+x))\n      .forEach(k=>{ o[k]=Math.min(3,base); });\n    return o;\n  }\n  picoDor(d){ const p=this.pontosDor(d);\n    const vs=Object.keys(p).map(k=>p[k]); return vs.length?Math.max.apply(null,vs):0; }\n  textoDor(d){\n    const p=this.pontosDor(d), ks=Object.keys(p);\n    if(!ks.length) return \"\";\n    const lado=m=>ks.filter(k=>k.indexOf(m+\":\")===0)\n      .map(k=>{ const q=k.split(\":\"); return q[1].toLowerCase()+(q[2]?\" \"+this.nomeSeg(q[2]):\"\")+\" \"+(this.INTENSIDADES[p[k]-1]||\"\"); });\n    const e=lado(\"esquerda\"), dr=lado(\"direita\"), partes=[];\n    if(e.length) partes.push(\"esq \"+e.join(\", \"));\n    if(dr.length) partes.push(\"dir \"+dr.join(\", \"));\n    return partes.join(\" · \");\n  }\n\n  state = {\n    tela:\"resumo\", metrica:\"dedos\", registros:[], metas:null, filtro:{},\n    form:null, erro:\"\", toast:\"\", armado:false, carregado:false, exemplo:true, hover:null\n  };\n  aoMover(e, g){\n    if(!g || !g.pts || !g.pts.length) return;\n    const r=e.currentTarget.getBoundingClientRect();\n    if(!r.width) return;\n    const x=(e.clientX-r.left)/r.width*320;\n    let melhor=g.pts[0];\n    g.pts.forEach(p=>{ if(Math.abs(p.x-x)<Math.abs(melhor.x-x)) melhor=p; });\n    const h=this.state.hover;\n    if(h && h.data===melhor.data) return;\n    this.setState({hover:melhor});\n  }\n\n  /* ---------- utilidades ---------- */\n  pad(n){ return String(n).padStart(2,\"0\"); }\n  iso(d){ return d.getFullYear()+\"-\"+this.pad(d.getMonth()+1)+\"-\"+this.pad(d.getDate()); }\n  hoje(){ return this.iso(new Date()); }\n  ts(s){ const a=String(s).split(\"-\").map(Number); return new Date(a[0],a[1]-1,a[2]).getTime(); }\n  diasAte(s){ return Math.round((this.ts(s)-this.ts(this.hoje()))/864e5); }\n  dm(s){ return String(s).slice(8,10)+\"/\"+String(s).slice(5,7); }\n  diaSemana(s){ return new Date(this.ts(s))\n    .toLocaleDateString(\"pt-BR\",{weekday:\"long\"}).replace(\"-feira\",\"\"); }\n  fmt(v,c){ if(v===null||v===undefined||!isFinite(v)) return \"—\";\n    return new Intl.NumberFormat(\"pt-BR\",{minimumFractionDigits:c===undefined?1:c,maximumFractionDigits:c===undefined?1:c}).format(v); }\n  sgn(v,c){ return (v>0?\"+\":v<0?\"−\":\"\")+this.fmt(Math.abs(v),c); }\n  met(chave){ return this.METRICAS.filter(m=>m.chave===chave)[0]; }\n  num(v){ const n=parseFloat(String(v).replace(\",\",\".\")); return isFinite(n)?n:null; }\n\n  /* ---------- persistência ---------- */\n  componentDidMount(){\n    let dados=null;\n    try{ dados=JSON.parse(localStorage.getItem(this.CHAVE)||\"null\"); }catch(e){ dados=null; }\n    if(dados && Array.isArray(dados.registros)){\n      /* o exemplo é regerado a cada carga; dados reais nunca são tocados */\n      const vazio=!dados.registros.length;\n      const ex=!!dados.exemplo||vazio;\n      this.setState({ registros:ex?this.gerarExemplo():dados.registros,\n        metas:dados.metas||this.metasPadrao(), exemplo:ex, carregado:true });\n    }else{\n      this.setState({ registros:this.gerarExemplo(), metas:this.metasPadrao(),\n        exemplo:true, carregado:true });\n    }\n  }\n  persistir(registros,metas,exemplo){\n    const st={ registros, metas:metas||this.state.metas,\n      exemplo:exemplo===undefined?this.state.exemplo:exemplo };\n    try{ localStorage.setItem(this.CHAVE,JSON.stringify(st)); }catch(e){}\n    this.setState(st);\n  }\n  aviso(t){ clearTimeout(this._t); this.setState({toast:t});\n    this._t=setTimeout(()=>this.setState({toast:\"\"}),2000); }\n\n  /* ---------- metas ---------- */\n  metasPadrao(){\n    const a=new Date(); a.setDate(a.getDate()+90);\n    const i=new Date(); i.setDate(i.getDate()-30);\n    const di=this.iso(i), da=this.iso(a);\n    return {\n      dedos:{alvo:8, inicio:-2.5, dataInicio:di, dataAlvo:da},\n      barra:{alvo:10, inicio:-2, dataInicio:di, dataAlvo:da},\n      peso:{alvo:65, inicio:66.6, dataInicio:di, dataAlvo:da}\n    };\n  }\n\n  /* ---------- dados de exemplo ---------- */\n  gerarExemplo(){\n    const regs=[]; let n=0;\n    const add=o=>regs.push(Object.assign({id:\"ex\"+(++n),criadoEm:n},o));\n    const dia=k=>{ const d=new Date(); d.setDate(d.getDate()-k); return this.iso(d); };\n    const r=a=>(Math.random()*2-1)*a;\n    const meio=v=>Math.round(v*2)/2;\n    for(let s=12;s>=0;s--){\n      const p=(12-s)/12;\n      const tri=base=>{ const sr=[0,1,2].map(j=>meio(base+r(.6)-j*0.5));\n        return {series:sr, carga:Math.round(sr.reduce((a,v)=>a+v,0)/3*10)/10}; };\n      [1,3,5,6].forEach((dd,i)=>{\n        const k=s*7+(6-dd); if(k<1) return;\n        if(i%2===0) add(Object.assign({tipo:\"dedos\",data:dia(k),agarra:20,seg:10},tri(-8+8*p)));\n        else add(Object.assign({tipo:\"barra\",data:dia(k),reps:5},tri(-6+6*p)));\n      });\n      if(s%2===0) add({tipo:\"peso\",data:dia(s*7+6),kg:Math.round((67.4-1.4*p+r(.25))*10)/10});\n    }\n    const comDor=regs.filter(r=>r.tipo===\"dedos\");\n    if(comDor.length>6) comDor[6].dor={pontos:{\"direita:Anelar:Proximal\":2}};\n    if(comDor.length>2) comDor[2].dor={pontos:{\"esquerda:Médio:Média\":1,\"direita:Anelar:PIP\":1}};\n    add({tipo:\"dedos\",data:dia(1),series:[0.5,0,-0.5],carga:0,agarra:20,seg:10});\n    add({tipo:\"barra\",data:dia(1),series:[0.5,0,-0.5],carga:0,reps:5});\n    add({tipo:\"peso\",data:dia(1),kg:66});\n    return regs;\n  }\n\n  /* ---------- séries ---------- */\n  filtroAtual(chave){\n    const m=this.met(chave); if(!m.filtro) return null;\n    const f=this.state.filtro[chave]; if(f!==undefined) return f;\n    const cont={};\n    this.state.registros.filter(r=>r.tipo===chave)\n      .forEach(r=>{ const v=r[m.filtro.campo]; cont[v]=(cont[v]||0)+1; });\n    const vs=Object.keys(cont).map(Number);\n    if(!vs.length) return null;\n    const padrao=this.props.agarraPadrao||20;\n    vs.sort((a,b)=>cont[b]-cont[a] || Math.abs(a-padrao)-Math.abs(b-padrao));\n    return vs[0];\n  }\n  daMetrica(chave){\n    const m=this.met(chave), f=this.filtroAtual(chave);\n    let l=this.state.registros.filter(r=>r.tipo===chave);\n    if(m.filtro && f!==undefined && f!==null) l=l.filter(r=>r[m.filtro.campo]===f);\n    return l.sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:(a.criadoEm||0)-(b.criadoEm||0));\n  }\n  melhorPorDia(chave){\n    const m=this.met(chave), mapa=new Map();\n    this.daMetrica(chave).forEach(r=>{\n      const v=m.valor(r), c=mapa.get(r.data);\n      if(!c || (m.maisMelhor ? v>m.valor(c) : true)) mapa.set(r.data,r);\n    });\n    return [...mapa.values()].sort((a,b)=>a.data<b.data?-1:1)\n      .map(r=>({t:this.ts(r.data), v:m.valor(r), data:r.data, reg:r}));\n  }\n  ultimo(chave){ const s=this.melhorPorDia(chave); return s.length?s[s.length-1]:null; }\n  pesoEm(data){\n    const l=this.state.registros.filter(r=>r.tipo===\"peso\" && r.data<=data)\n      .sort((a,b)=>a.data<b.data?-1:1);\n    return l.length?l[l.length-1].kg:null;\n  }\n\n  /* ---------- gráfico ---------- */\n  grafico(pontos,meta){\n    if(!pontos.length) return {temDados:false, vazio:true};\n    const W=320,H=132,topo=12,base=112,ins=5;\n    const vals=pontos.map(p=>p.v).concat(meta?[meta.alvo]:[]);\n    let lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);\n    if(hi===lo){hi+=1;lo-=1}\n    const pad=(hi-lo)*0.14; lo-=pad; hi+=pad;\n    const t0=pontos[0].t, t1=pontos[pontos.length-1].t;\n    const X=t=>t1===t0?W/2:ins+(t-t0)/(t1-t0)*(W-ins*2);\n    const Y=v=>topo+(hi-v)/(hi-lo)*(base-topo);\n    const rd=v=>Math.round(v*10)/10;\n    const d=pontos.map((p,i)=>(i?\"L\":\"M\")+rd(X(p.t))+\" \"+rd(Y(p.v))).join(\" \");\n    const area=pontos.length>1\n      ? d+\" L\"+rd(X(t1))+\" \"+base+\" L\"+rd(X(t0))+\" \"+base+\" Z\" : \"\";\n    const my=meta?Math.max(topo-2,Math.min(base,Y(meta.alvo))):-99;\n    return { temDados:true, vazio:false, linha:d, area:area,\n      pts: pontos.map(p=>({x:rd(X(p.t)), y:rd(Y(p.v)), v:p.v, data:p.data, reg:p.reg})),\n      ultX:rd(X(pontos[pontos.length-1].t)), ultY:rd(Y(pontos[pontos.length-1].v)),\n      metaY:rd(my), metaTxtY:rd(my-5), metaTxt:meta?this.fmt(meta.alvo,1):\"\",\n      dataIni:this.dm(pontos[0].data), dataFim:this.dm(pontos[pontos.length-1].data),\n      descricao:\"Evolução dos registros\" };\n  }\n\n  /* ---------- formulário ---------- */\n  serie(r){ return (r.series&&r.series.length)?r.series:[r.carga]; }\n  melhorSerie(r){ return Math.max.apply(null,this.serie(r)); }\n  camposDe(tipo,f){\n    if(tipo===\"dedos\"||tipo===\"barra\") return [\n      {k:\"s1\", rotulo:\"1ª série (kg)\", passo:0.5},\n      {k:\"s2\", rotulo:\"2ª série (kg)\", passo:0.5},\n      {k:\"s3\", rotulo:\"3ª série (kg)\", passo:0.5}\n    ];\n    if(tipo===\"peso\") return [{k:\"kg\", rotulo:\"Peso corporal (kg)\", passo:0.1}];\n    return [];\n  }\n  ultimoDe(tipo){\n    const l=this.state.registros.filter(r=>r.tipo===tipo)\n      .sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:(a.criadoEm||0)-(b.criadoEm||0));\n    return l.length?l[l.length-1]:null;\n  }\n  novoForm(tipo){\n    const u=this.ultimoDe(tipo)||{};\n    const agarraPadrao=this.props.agarraPadrao||20;\n    const s=u.carga!==undefined?this.serie(u):[0];\n    return { id:null, tipo:tipo, data:this.hoje(),\n      s1:s[0]!==undefined?s[0]:0, s2:s[1]!==undefined?s[1]:s[0]||0, s3:s[2]!==undefined?s[2]:s[0]||0,\n      carga:u.carga!==undefined?u.carga:0,\n      seg:u.seg!==undefined?u.seg:10,\n      reps:u.reps!==undefined?u.reps:5,\n      kg:u.kg!==undefined?u.kg:66,\n      agarra:u.agarra!==undefined?u.agarra:agarraPadrao,\n      dorSim:false, dorPontos:{} };\n  }\n  abrir(tipo){ this.setState({form:this.novoForm(tipo), erro:\"\", armado:false}); }\n  editar(reg){\n    const f=Object.assign(this.novoForm(reg.tipo),reg,{id:reg.id});\n    const s=this.serie(reg);\n    f.s1=s[0]; f.s2=s[1]!==undefined?s[1]:s[0]; f.s3=s[2]!==undefined?s[2]:s[0];\n    if(reg.dor) Object.assign(f,{dorSim:true, dorPontos:this.expandirDor(this.pontosDor(reg.dor))});\n    this.setState({form:f, erro:\"\", armado:false});\n  }\n  setF(k,v){ this.setState(s=>({form:Object.assign({},s.form,{[k]:v})})); }\n  /* os inputs do runtime são não-controlados: o DOM é a fonte do que está na tela,\n     então os passos leem e escrevem no próprio campo e espelham no estado */\n  refCampo(k){ return el=>{ this._campos=this._campos||{};\n    if(el) this._campos[k]=el; else delete this._campos[k]; }; }\n  valorCampo(k){\n    const el=this._campos&&this._campos[k];\n    const v=el?this.num(el.value):null;\n    if(v!==null) return v;\n    return this.num((this.state.form||{})[k]);\n  }\n  passo(k,d){\n    const casas=String(d).split(\".\")[1];\n    let n=(this.valorCampo(k)||0)+d;\n    if(k===\"seg\"||k===\"reps\") n=Math.max(1,n);\n    n=parseFloat(n.toFixed(casas?casas.length:0));\n    const el=this._campos&&this._campos[k];\n    if(el) el.value=n;\n    this.setState(s=>({form:Object.assign({},s.form,{[k]:n})}));\n  }\n  componentDidUpdate(pp,ps){\n    const a=(ps&&ps.form)||null, b=this.state.form;\n    const ia=a?(a.id||\"novo\")+\":\"+a.tipo:\"\", ib=b?(b.id||\"novo\")+\":\"+b.tipo:\"\";\n    if(b && ia!==ib && this._campos){\n      Object.keys(this._campos).forEach(k=>{\n        if(b[k]!==undefined && this._campos[k]) this._campos[k].value=b[k];\n      });\n    }\n  }\n  salvar(){\n    const f=this.state.form, m={id:f.id||(\"r\"+Date.now().toString(36)),\n      tipo:f.tipo, data:f.data, criadoEm:Date.now()};\n    if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(f.data)) return this.setState({erro:\"Escolha a data.\"});\n    if(f.tipo===\"dedos\"||f.tipo===\"barra\"){\n      const s=[this.valorCampo(\"s1\"),this.valorCampo(\"s2\"),this.valorCampo(\"s3\")];\n      if(s.some(v=>v===null)) return this.setState({erro:\"Preencha as três séries (0 = só o peso do corpo).\"});\n      const media=Math.round(s.reduce((a,v)=>a+v,0)/3*10)/10;\n      Object.assign(m,{series:s, carga:media});\n      if(f.tipo===\"dedos\"){\n        Object.assign(m,{seg:this.num(f.seg)||10, agarra:this.num(f.agarra)||20});\n        if(f.dorSim){\n          const p=f.dorPontos||{};\n          if(!Object.keys(p).length) return this.setState({erro:\"Toque na falange ou articulação que doeu.\"});\n          m.dor={ pontos:Object.assign({},p) };\n        }\n      }\n      else m.reps=this.num(f.reps)||5;\n    }else if(f.tipo===\"peso\"){\n      const k=this.valorCampo(\"kg\");\n      if(!k||k<25||k>250) return this.setState({erro:\"Peso entre 25 e 250 kg.\"});\n      m.kg=k;\n    }else{\n      Object.assign(m,{nivel:f.nivel||\"ok\", nota:String(f.nota||\"\").slice(0,140)});\n    }\n    /* o primeiro registro real encerra o modo exemplo: os dados fictícios saem\n       e nada mais é regenerado no carregamento */\n    const noExemplo=this.state.exemplo;\n    const outros=this.state.registros.filter(r=>\n      r.id!==m.id && !(noExemplo && String(r.id).indexOf(\"ex\")===0));\n    this.persistir(outros.concat([m]), this.state.metas, false);\n    this.setState({form:null, erro:\"\"});\n    this.aviso(noExemplo?\"Exemplo encerrado · registro salvo\":(f.id?\"Registro atualizado\":\"Registro salvo\"));\n  }\n  excluir(){\n    const f=this.state.form; if(!f||!f.id) return;\n div class=\\\"msc-barra\\\"><div><\\/div><\\/div><p class=\\\"msc-num\\\"><\\/p><\\/div>\";\n  dadosMascote(pesoAtual){\n    const d=this.ultimo(\"dedos\"), b=this.ultimo(\"barra\");\n    const rel=u=>(u && pesoAtual)?(pesoAtual+u.v)/pesoAtual*100:null;\n    return { dedos:rel(d), barra:rel(b), exemplo:this.state.exemplo };\n  }\n  mascote(el, d){\n    if(!el) return;\n    if(!el.firstChild){\n      if(!document.getElementById(\"msc-css\")){\n        const s=document.createElement(\"style\"); s.id=\"msc-css\"; s.textContent=this.MASCOTE_CSS;\n        document.head.appendChild(s);\n      }\n      el.className=\"msc\"; el.innerHTML=this.MASCOTE_HTML;\n    }\n    const C=this.MASCOTE, temDados=d.dedos!==null && d.barra!==null;\n    const sd=temDados?d.dedos/C.corteDedos:0, sb=temDados?d.barra/C.corteBarra:0;\n    const media=(sd+sb)/2, fase=media>=1?1:0;\n    el.querySelector(\".msc-nome\").textContent=fase?\"Máquina\":\"Frango\";\n    el.querySelector(\".msc-msg\").textContent=!temDados\n      ? \"Registre peso, dedos e barra para o frango começar a treinar.\"\n      : fase ? \"Modo máquina ligado. Agora é não deixar enferrujar.\"\n      : sd<=sb ? \"Ponto fraco: dedos. Meta: \"+C.corteDedos+\"% do peso.\"\n      : \"Ponto fraco: barra. Meta: \"+C.corteBarra+\"% do peso.\";\n    el.querySelector(\".msc-barra div\").style.width=Math.min(100,media*100)+\"%\";\n    el.querySelector(\".msc-num\").textContent=temDados\n      ? \"Dedos \"+Math.round(d.dedos)+\"% / \"+C.corteDedos+\"%  ·  Barra \"+Math.round(d.barra)+\"% / \"+C.corteBarra+\"%\" : \"\";\n    let anterior=null;\n    try{ const v=localStorage.getItem(C.chave); anterior=v===null?null:+v; }catch(e){}\n    if(el.dataset.fase!==String(fase)){\n      const animar=!d.exemplo && temDados && anterior!==null && anterior!==fase;\n      el.querySelectorAll(\".st\").forEach(g=>{\n        g.classList.remove(\"on\",\"pop\");\n        if(+g.getAttribute(\"data-fase\")===fase){ g.classList.add(\"on\");\n          if(animar){ void g.getBBox(); g.classList.add(\"pop\"); } }\n      });\n      if(animar){ const bu=el.querySelector(\".burst\"); bu.classList.remove(\"go\"); void bu.getBBox(); bu.classList.add(\"go\"); }\n      el.dataset.fase=String(fase);\n    }\n    if(!d.exemplo && temDados){ try{ localStorage.setItem(C.chave,String(fase)); }catch(e){} }\n  }\n\n  /* ---------- render ---------- */\n  renderVals(){\n    const S=this.state, temaProp=this.props.tema||\"auto\";\n    const tela=S.tela, mAtual=this.met(S.metrica);\n    const metas=S.metas||this.metasPadrao();\n    const pesoAtual=(this.ultimo(\"peso\")||{}).v||null;\n    const ultDedos=this.ultimo(\"dedos\");\n\n    /* hero: Dedos (esquerda) e Barra (direita), no mesmo modo (relativa ou carga) */\n    const heroDe=(chave,nome)=>{\n      const u=this.ultimo(chave);\n      const rel=(u && pesoAtual) ? (pesoAtual+u.v)/pesoAtual*100 : null;\n      return {\n        nome:nome,\n        valor: rel?this.fmt(Math.round(rel),0):\"—\", unidade:\"%\",\n        carga: u?this.sgn(u.v,1)+\" kg\":\"—\",\n        pesoLinha: pesoAtual?(this.fmt(pesoAtual,1)+\" kg peso corporal\"):\"Registre seu peso corporal\",\n        dataLinha: u?this.dm(u.data):(pesoAtual?\"Nenhum registro ainda\":\"\")\n      };\n    };\n    const hero=heroDe(\"dedos\",\"Dedos\");\n    const heroB=heroDe(\"barra\",\"Barra\");\n    const dadosMsc=this.dadosMascote(pesoAtual);\n\n    /* metas */\n    const linhasMeta=this.METRICAS.map(m=>{\n      const meta=metas[m.chave]||{alvo:0,inicio:0,dataInicio:this.hoje(),dataAlvo:this.hoje()};\n      const u=this.ultimo(m.chave), atual=u?u.v:meta.inicio;\n      const t0=this.ts(meta.dataInicio), t1=this.ts(meta.dataAlvo), agora=Date.now();\n      const frac=t1>t0?Math.min(1,Math.max(0,(agora-t0)/(t1-t0))):1;\n      const alcance=meta.alvo-meta.inicio;\n      const prog=alcance?(atual-meta.inicio)/alcance:1;\n      const esperado=meta.inicio+alcance*frac;\n      const diff=alcance?(atual-esperado)/alcance:0;\n      const dias=this.diasAte(meta.dataAlvo);\n      const falta=meta.alvo-atual;\n      const st=diff>0.05?[\"adiantado\",\"var(--ok)\"]:diff<-0.05?[\"atrasado\",\"var(--warn)\"]:[\"no ritmo\",\"var(--ink2)\"];\n      return { chave:m.chave, rotulo:m.nome,\n        numeros:this.fmt(atual,1)+\" → \"+this.fmt(meta.alvo,1)+\" \"+m.unidade,\n        pct:Math.round(Math.min(100,Math.max(0,prog*100))),\n        pctEsperado:Math.round(Math.min(100,Math.max(0,frac*100))),\n        falta:(Math.abs(falta)<0.05?\"meta alcançada\":\"faltam \"+this.fmt(Math.abs(falta),1)+\" \"+m.unidade)\n          +(dias>0?\" em \"+dias+\" dias\":\" · prazo vencido\"),\n        status:st[0], cor:st[1] };\n    });\n\n    /* resumo */\n    const resumo=this.METRICAS.map(m=>{\n      const serie=this.melhorPorDia(m.chave);\n      const u=serie.length?serie[serie.length-1]:null;\n      const lim=this.iso(new Date(Date.now()-30*864e5));\n      const antes=serie.filter(p=>p.data<=lim);\n      const ref=antes.length?antes[antes.length-1]:(serie.length?serie[0]:null);\n      const d=(u&&ref&&ref!==u)?u.v-ref.v:null;\n      const base=u?(m.chave===\"dedos\"?\"média de 3 séries · \"+(u.reg.agarra||20)+\" mm · \"+this.dm(u.data)\n        :m.chave===\"barra\"?\"média de 3 séries · \"+(u.reg.reps||5)+\" reps · \"+this.dm(u.data)\n        :(m.detalhe(u.reg)||this.dm(u.data))):\"sem registros\";\n      return { rotulo:m.nome,\n        detalhe:base+(d===null?\"\":\" · \"+this.sgn(d,1)+\" em 30 d\"),\n        valor:u?this.fmt(u.v,1)+\" \"+m.unidade:\"—\",\n        onClick:()=>{ this.setState({tela:\"detalhe\", metrica:m.chave}); window.scrollTo(0,0); } };\n    });\n\n    /* dor */\n    const dores=S.registros.filter(r=>r.tipo===\"dedos\" && r.dor).sort((a,b)=>a.data<b.data?1:-1);\n    const ultDor=dores[0];\n    const alertaDor=(ultDor && this.diasAte(ultDor.data)>-21)\n      ? { ativo:true, texto:\"Dor em \"+this.dm(ultDor.data)+\" · \"+this.textoDor(ultDor.dor) }\n\n      : { ativo:false, texto:\"\" };\n\n    /* detalhe */\n    const serie=this.melhorPorDia(S.metrica).map(p=>Object.assign({},p));\n    const uDet=serie.length?serie[serie.length-1]:null;\n    const vals=serie.map(p=>p.v);\n    const lim30=this.iso(new Date(Date.now()-30*864e5));\n    const s30=serie.filter(p=>p.data>=lim30);\n    const media=s30.length?s30.reduce((a,p)=>a+p.v,0)/s30.length:null;\n    const filtroAtivo=this.filtroAtual(S.metrica);\n    const opcoesFiltro=mAtual.filtro\n      ? [...new Set(S.registros.filter(r=>r.tipo===S.metrica).map(r=>r[mAtual.filtro.campo]))]\n          .sort((a,b)=>b-a) : [];\n    this._g=this.grafico(serie, metas[S.metrica]);\n    const det={\n      valor: uDet?(mAtual.maisMelhor?this.sgn(uDet.v,1):this.fmt(uDet.v,1)):\"—\",\n      unidade: mAtual.unidade,\n      sub: \"\",\n      /* linha 1: protocolo do teste, em etiquetas; linha 2: último registro */\n      chips: (S.metrica===\"dedos\"\n          ? [\"Média de 3 séries\",\"Max hang\",((filtroAtivo!==null&&filtroAtivo!==undefined)?filtroAtivo:20)+\" mm\",\"10 s\"]\n          : S.metrica===\"barra\" ? [\"Média de 3 séries\",\"Barra fixa\",\"5 repetições\"]\n          : [\"Base da força relativa\"])\n        .concat(mAtual.descanso?[\"Descanso \"+mAtual.descanso+\" entre séries\"]:[]),\n      ultimo: uDet ? (\"Último registro em \"+this.dm(uDet.data)\n          +(S.metrica===\"dedos\"&&pesoAtual?\" · \"+Math.round((pesoAtual+uDet.v)/pesoAtual*100)+\"% do peso corporal\":\"\"))\n        : \"Nenhum registro ainda\",\n      temFiltro: opcoesFiltro.length>1,\n      filtros: opcoesFiltro.map(v=>{\n        const on=filtroAtivo===v;\n        return { rotulo:v+\" \"+mAtual.filtro.sufixo,\n          fundo:on?\"var(--ink)\":\"transparent\", cor:on?\"var(--inv)\":\"var(--ink)\",\n          onClick:()=>this.setState(st=>({filtro:Object.assign({},st.filtro,{[S.metrica]:on?null:v})})) };\n      }),\n      grafico: Object.assign({}, this._g, {\n        onMove:e=>this.aoMover(e, this._g), onSair:()=>this.setState({hover:null}) }),\n      stats:[\n        { rotulo:\"melhor\", valor: vals.length?this.fmt(mAtual.maisMelhor?Math.max.apply(null,vals):Math.min.apply(null,vals),1):\"—\" },\n        { rotulo:\"média 30 d\", valor: media!==null?this.fmt(media,1):\"—\" },\n        { rotulo:\"sessões\", valor: String(this.daMetrica(S.metrica).length) }\n      ],\n      hover: (()=>{ const h=S.hover;\n        const semHover={ tem:false, x:-99, y:-99, opacidade:0, esq:50, valor:\"\", series:\"\", extra:\"\",\n          legendaCentro:\"meta \"+this.fmt((metas[S.metrica]||{}).alvo,1)+\" \"+mAtual.unidade,\n          corLegenda:\"var(--ink3)\" };\n        if(!h) return semHover;\n        const dor=h.reg&&h.reg.dor;\n        const valor=(mAtual.maisMelhor?this.sgn(h.v,1):this.fmt(h.v,1))+\" \"+mAtual.unidade;\n        const series=(mAtual.series&&h.reg&&h.reg.series)\n          ? this.serie(h.reg).map(v=>this.fmt(v,1)).join(\"  /  \") : this.diaSemana(h.data);\n        const pct=h.x/320*100;\n        return Object.assign({}, semHover, { tem:true, temExtra:!!dor, x:h.x, y:h.y, opacidade:1, valor, series,\n          extra: dor?(\"dor · \"+this.textoDor(dor)):\"\",\n          legendaCentro:this.dm(h.data), corLegenda:\"var(--ink)\",\n          esq:Math.round(Math.max(22, Math.min(78, pct))*10)/10 });\n      })(),\n      contagem: this.daMetrica(S.metrica).length+\" sessões\",\n      registros: this.daMetrica(S.metrica).slice().reverse().map(r=>({\n        temDor: !!r.dor, textoDor: r.dor?this.textoDor(r.dor):\"\",\n        corDor: r.dor?this.corDor(this.picoDor(r.dor)):\"transparent\",\n        data:this.dm(r.data),\n        detalhe: (mAtual.series\n          ? \"melhor \"+this.sgn(this.melhorSerie(r),1)+\" kg · \"+this.serie(r).map(v=>this.fmt(v,1)).join(\" / \")\n          : this.diaSemana(r.data)),\n        valor:(mAtual.maisMelhor?this.sgn(mAtual.valor(r),1):this.fmt(mAtual.valor(r),1))+\" \"+mAtual.unidade,\n        onEdit:()=>this.editar(r) }))\n    };\n\n    /* metas editáveis */\n    const metasEdit=this.METRICAS.map(m=>{\n      const meta=metas[m.chave]||{};\n      const u=this.ultimo(m.chave);\n      return {\n      rotulo:m.chave===\"peso\"?\"Peso Corporal\":m.nome, unidade:m.unidade,\n      alvo:meta.alvo, dataAlvo:meta.dataAlvo,\n      rotuloAlvo:\"Quero chegar a (\"+m.unidade+\")\",\n      hoje:u?this.fmt(u.v,1)+\" \"+m.unidade:\"sem registro\",\n      explica:\"Ponto de partida: \"+this.fmt(meta.inicio,1)+\" \"+m.unidade\n        +\" em \"+this.dm(meta.dataInicio)+\". O progresso no resumo é medido desse ponto até o alvo.\",\n      onAlvo:e=>{ const v=this.num(e.target.value);\n        const nv=Object.assign({},metas,{[m.chave]:Object.assign({},metas[m.chave],{alvo:v===null?0:v})});\n        this.persistir(S.registros,nv); },\n      onData:e=>{ const nv=Object.assign({},metas,{[m.chave]:Object.assign({},metas[m.chave],{dataAlvo:e.target.value})});\n        this.persistir(S.registros,nv); }\n    }; });\n\n    /* sheet */\n    const f=S.form;\n    const sheet = f ? {\n      aberto:true,\n      titulo: (f.id?\"Editar · \":\"\")+this.met(f.tipo).nome,\n      podeTrocarTipo: false, tipos: [],\n      data:f.data, onData:e=>this.setF(\"data\",e.target.value),\n      campos: this.camposDe(f.tipo).map(c=>({\n        rotulo:c.rotulo, passo:c.passo, valor:f[c.k], ref:this.refCampo(c.k),\n        onChange:e=>this.setF(c.k,e.target.value),\n        mais:()=>this.passo(c.k,c.passo), menos:()=>this.passo(c.k,-c.passo) })),\n      protocolo: f.tipo===\"dedos\"\n        ? {tem:true, texto:\"Max hang · agarra de 20 mm · 10 s pendurado. 0 = só o peso do corpo. O gráfico usa a média das três séries.\"}\n        : f.tipo===\"barra\"\n        ? {tem:true, texto:\"Barra fixa · 5 repetições. 0 = só o peso do corpo. O gráfico usa a média das três séries.\"}\n        : f.tipo===\"peso\"\n        ? {tem:true, texto:\"Peso corporal, base da força relativa no resumo.\"}\n        : {tem:false, texto:\"\"},\n      temDor: f.tipo===\"dedos\",\n      dorAberta: !!f.dorSim,\n      dorSimNao: [[\"Não\",false],[\"Sim\",true]].map(o=>{\n        const on=!!f.dorSim===o[1];\n        return { rotulo:o[0], fundo:on?\"var(--ink)\":\"transparent\", cor:on?\"var(--inv)\":\"var(--ink)\",\n          onClick:()=>this.setF(\"dorSim\",o[1]) };\n      }),\n      esq: this.mapaMao(\"esquerda\", f), dir: this.mapaMao(\"direita\", f),\n      legenda: this.INTENSIDADES.map((r,i)=>({rotulo:r, cor:this.corDor(i+1)})).concat([{rotulo:\"articulação\", cor:\"var(--field)\"}]),\n      erro:{tem:!!S.erro, texto:S.erro},\n      podeExcluir:!!f.id, rotuloExcluir:S.armado?\"Confirmar\":\"Excluir\",\n      onExcluir:()=>this.excluir(), onSalvar:()=>this.salvar(),\n      onFechar:()=>this.setState({form:null, erro:\"\", armado:false}),\n      onFundo:()=>this.setState({form:null, erro:\"\", armado:false}),\n      onDentro:e=>e.stopPropagation()\n    } : { aberto:false, tipos:[], campos:[], dorSimNao:[], legenda:[],\n          esq:this.mapaMao(\"esquerda\",null), dir:this.mapaMao(\"direita\",null),\n          protocolo:{tem:false,texto:\"\"}, erro:{tem:false,texto:\"\"} };\n\n    /* nav */\n    const abas=[{k:\"resumo\",r:\"Resumo\"},{k:\"dedos\",r:\"Dedos\"},{k:\"barra\",r:\"Barra\"},\n      {k:\"peso\",r:\"Peso\"},{k:\"dados\",r:\"Ajustes\"}];\n    const ativo = tela===\"resumo\"?\"resumo\" : tela===\"dados\"?\"dados\" : S.metrica;\n    const nav=abas.map(a=>{\n      const on=ativo===a.k;\n      return { rotulo:a.r, cor:on?\"var(--ink)\":\"var(--ink3)\", barra:on?\"var(--ink)\":\"transparent\",\n        onClick:()=>{ window.scrollTo(0,0);\n          if(a.k===\"resumo\"||a.k===\"dados\") this.setState({tela:a.k});\n          else this.setState({tela:\"detalhe\", metrica:a.k}); } };\n    });\n\n    const prazoDias=this.diasAte((metas.dedos||{}).dataAlvo||this.hoje());\n\n    return {\n      tema: temaProp===\"auto\"?\"\":temaProp,\n      dataHoje: new Date().toLocaleDateString(\"pt-BR\",{weekday:\"long\",day:\"numeric\",month:\"long\"}),\n      tituloTela: tela===\"resumo\"?\"Diário de escalada\" : tela===\"dados\"?\"Ajustes\" : mAtual.titulo,\n      mostrarRegistrar: tela===\"detalhe\",\n      ehResumo: tela===\"resumo\", ehDetalhe: tela===\"detalhe\", ehDados: tela===\"dados\",\n      hero, heroB, metas:linhasMeta, resumo, alertaDor,\n      refMascote: el=>this.mascote(el, dadosMsc),\n      metasPrazo: prazoDias>0?prazoDias+\" dias\":\"prazo vencido\",\n      det, metasEdit,\n\n      infoArquivo: S.registros.length+\" registros guardados neste navegador\"\n        +(S.exemplo?\". Os dados atuais são um exemplo fictício — limpe quando começar de verdade.\":\".\"),\n      rotuloLimpar: S.exemplo?\"Limpar exemplo\":\"Apagar tudo\",\n      onExemplo:()=>{ if(S.registros.length && !S.exemplo\n          && !confirm(\"Substituir os registros atuais por três meses de dados fictícios?\")) return;\n        this.persistir(this.gerarExemplo(), this.metasPadrao(), true);\n        this.aviso(\"Exemplo carregado\"); },\n      onExportar:()=>this.exportar(),\n      onImportar:()=>{ if(this._file) this._file.click(); },\n      onArquivo:e=>this.importar(e),\n      onLimpar:()=>{ if(!confirm(\"Apagar todos os registros deste navegador?\")) return;\n        this.persistir([], this.metasPadrao(), false); this.aviso(\"Tudo apagado\"); },\n      refArquivo:el=>{ this._file=el; },\n      onRegistrar:()=>this.abrir(tela===\"detalhe\"?S.metrica:\"dedos\"),\n      nav, sheet,\n      toast:{tem:!!S.toast, texto:S.toast}\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
